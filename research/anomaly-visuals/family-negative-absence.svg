<svg xmlns="http://www.w3.org/2000/svg" width="800" height="838" viewBox="0 0 800 838" role="img" aria-labelledby="title desc"><title id="title">No event is not the same as no activity</title><desc id="desc">Negative Anomaly (Absence): one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Define when a source is expected to report. Compare: Check delivery, asset state, filters and retention separately. An outage or parser failure can look like deliberate impairment.</desc><rect width="800" height="838" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">No event is not the same as no</tspan><tspan x="30" dy="53.199999999999996">activity</tspan></text><text x="30" y="204.79999999999998" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="182.79999999999998" data-bottom="213.59999999999997"><tspan x="30" dy="0">Negative Anomaly (Absence)</tspan></text><text x="30" y="242.59999999999997" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="225.59999999999997" data-bottom="249.39999999999998"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="271.4" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="308.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="286.4" data-bottom="348"><tspan x="45" dy="0">Expected</tspan><tspan x="45" dy="30.799999999999997">heartbeat</tspan></text><path d="M262 323.2 L282 323.2" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 318.2 L282 323.2 L275 328.2" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="271.4" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="308.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="286.4" data-bottom="348"><tspan x="301" dy="0">Missing</tspan><tspan x="301" dy="30.799999999999997">observation</tspan></text><path d="M518 323.2 L538 323.2" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 318.2 L538 323.2 L531 328.2" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="271.4" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="308.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="286.4" data-bottom="348"><tspan x="557" dy="0">Independent</tspan><tspan x="557" dy="30.799999999999997">health check</tspan></text><text x="30" y="421" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="399" data-bottom="460.6"><tspan x="30" dy="0">The gap is an observation problem until independent health</tspan><tspan x="30" dy="30.799999999999997">evidence explains it.</tspan></text><rect x="30" y="476.6" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="516.6" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="494.6" data-bottom="525.4"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="559.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="537.4" data-bottom="599"><tspan x="48" dy="0">Define when a source is</tspan><tspan x="48" dy="30.799999999999997">expected to report.</tspan></text><rect x="410" y="476.6" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="516.6" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="494.6" data-bottom="525.4"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="559.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="537.4" data-bottom="629.8"><tspan x="428" dy="0">Check delivery, asset</tspan><tspan x="428" dy="30.799999999999997">state, filters and</tspan><tspan x="428" dy="30.799999999999997">retention separately.</tspan></text><rect x="30" y="667.8" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="707.8" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="685.8" data-bottom="747.4"><tspan x="47" dy="0">An outage or parser failure can look like deliberate</tspan><tspan x="47" dy="30.799999999999997">impairment.</tspan></text><text x="30" y="807.4" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="791.4" data-bottom="813.8"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="848" viewBox="0 0 400 848" role="img" aria-labelledby="title desc"><title id="title">Volt Typhoon: the execution host matters</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: Microsoft described ntdsutil IFM credential extraction against domain controllers, with living-off-the-land activity. Detection hypothesis: Review IFM creation on the DC, its principal, approved backup context and subsequent data movement. A non-DC-only filter misses this execution context. A remote initiation host is not necessarily the execution host.</desc><rect width="400" height="848" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Volt Typhoon: the</tspan><tspan x="22" dy="42">execution host</tspan><tspan x="22" dy="42">matters</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="241.2" width="356" height="174" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="277.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="259.2" data-bottom="284.4"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="314.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="296.4" data-bottom="397.2"><tspan x="40" dy="0">Microsoft described ntdsutil</tspan><tspan x="40" dy="25.2">IFM credential extraction</tspan><tspan x="40" dy="25.2">against domain controllers, with</tspan><tspan x="40" dy="25.2">living-off-the-land activity.</tspan></text><rect x="22" y="431.2" width="356" height="174" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="467.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="449.2" data-bottom="474.4"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="504.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="486.4" data-bottom="587.1999999999999"><tspan x="40" dy="0">Review IFM creation on the DC,</tspan><tspan x="40" dy="25.2">its principal, approved backup</tspan><tspan x="40" dy="25.2">context and subsequent data</tspan><tspan x="40" dy="25.2">movement.</tspan></text><rect x="22" y="621.2" width="356" height="140.8" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="657.2" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="639.2" data-bottom="740"><tspan x="39" dy="0">A non-DC-only filter misses this</tspan><tspan x="39" dy="25.2">execution context. A remote</tspan><tspan x="39" dy="25.2">initiation host is not necessarily</tspan><tspan x="39" dy="25.2">the execution host.</tspan></text><text x="22" y="798" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="784" data-bottom="823.2"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

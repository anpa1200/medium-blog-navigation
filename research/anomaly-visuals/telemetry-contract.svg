<svg xmlns="http://www.w3.org/2000/svg" width="800" height="958" viewBox="0 0 800 958" role="img" aria-labelledby="title desc"><title id="title">A field name is not a collection guarantee</title><desc id="desc">A telemetry contract connects source meaning to query assumptions. This diagram does not imply that a SIEM enables collection automatically. Source: Provider, channel, event version. Collection: Policy, filters, delivery health. Normalization: Parser, units, keys, clock. Analytic: Tested fields and explicit gaps. Distinct pipelines: Security 4688 and Sysmon 1 are separate process-creation sources. Validate each adapter. Missing observations: No event can mean no activity, disabled auditing, filtering, delay or failed collection. Validate raw records before treating a normalized table as detection coverage.</desc><rect width="800" height="958" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">A field name is not a collection</tspan><tspan x="30" dy="53.199999999999996">guarantee</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="228.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="243.59999999999997" data-bottom="274.4"><tspan x="45" dy="0">Source</tspan></text><text x="45" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="286.4" data-bottom="348"><tspan x="45" dy="0">Provider, channel, event</tspan><tspan x="45" dy="30.799999999999997">version.</tspan></text><path d="M390 295.79999999999995 L410 295.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 290.79999999999995 L410 295.79999999999995 L403 300.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="228.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="243.59999999999997" data-bottom="274.4"><tspan x="429" dy="0">Collection</tspan></text><text x="429" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="286.4" data-bottom="348"><tspan x="429" dy="0">Policy, filters, delivery</tspan><tspan x="429" dy="30.799999999999997">health.</tspan></text><path d="M592 366.99999999999994 L592 384.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M592 384.99999999999994 L208 384.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M208 384.99999999999994 L208 402.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M203 395.99999999999994 L208 402.99999999999994 L213 395.99999999999994" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="30" y="406.99999999999994" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="443.99999999999994" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="421.99999999999994" data-bottom="452.79999999999995"><tspan x="45" dy="0">Normalization</tspan></text><text x="45" y="486.79999999999995" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="464.79999999999995" data-bottom="495.59999999999997"><tspan x="45" dy="0">Parser, units, keys, clock.</tspan></text><path d="M390 474.1999999
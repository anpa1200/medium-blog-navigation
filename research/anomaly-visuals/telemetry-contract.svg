6.1999999999998" data-bottom="749.3999999999999"><tspan x="428" dy="0">No event can mean no</tspan><tspan x="428" dy="30.799999999999997">activity, disabled auditing,</tspan><tspan x="428" dy="30.799999999999997">filtering, delay or failed</tspan><tspan x="428" dy="30.799999999999997">collection.</tspan></text><rect x="30" y="787.3999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="827.3999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="805.3999999999999" data-bottom="866.9999999999999"><tspan x="47" dy="0">Validate raw records before treating a normalized table as</tspan><tspan x="47" dy="30.799999999999997">detection coverage.</tspan></text><text x="30" y="926.9999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="910.9999999999999" data-bottom="933.3999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1245" viewBox="0 0 400 1245" role="img" aria-labelledby="title desc"><title id="title">DCSync: keep source correlation honest</title><desc id="desc">Arrows show an enrichment workflow, not the temporal order of the Windows events. Approved replication needs scoped inventory-backed context, not a name-based exemption. 4662 on the DC: Audited replication-right access. Bounded join: Same DC + normalized logon ID + event time. 4624 context: Use a suitable matching logon, if available. Prerequisite: Directory Service Access auditing + applicable SACL. A SACL selects auditing; it does not grant rights. Unresolved is a valid result: 4662 has no native client-IP field. Retain candidates when source enrichment is missing or ambiguous. One matching replication right does not prove successful credential extraction.</desc><rect width="400" height="1245" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">DCSync: keep source</tspan><tspan x="22" dy="42">correlation honest</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="199.2" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="232.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="214.2" data-bottom="239.39999999999998"><tspan x="37" dy="0">4662 on the DC</tspan></text><text x="37" y="269.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="251.39999999999998" data-bottom="276.59999999999997"><tspan x="37" dy="0">Audited replication-right access.</tspan></text><path d="M200 320.79999999999995 L200 356.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 349.79999999999995 L200 356.79999999999995 L205 349.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="360.79999999999995" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="393.79999999999995" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="375.79999999999995" data-bottom="400.99999999999994"><tspan x="37" dy="0">Bounded join</tspan></text><text x="37" y="430.99999999999994" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="412.99999999999994" data-bottom="463.3999999999999"><tspan x="37" dy="0">Same DC + normalized logon ID +</tspan><tspan x="37" dy="25.2">event time.</tspan></text><path d="M200 482.4 L200 518.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 511.4 L200 518.4 L205 511.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="522.4" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="555.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="537.4" data-bottom="562.6"><tspan x="37" dy="0">4624 context</tspan></text><text x="37" y="592.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="574.6" data-bottom="625"><tspan x="37" dy="0">Use a suitable matching logon, if</tspan><tspan x="37" dy="25.2">available.</tspan></text><rect x="22" y="664" width="356" height="174" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="700" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="682" data-bottom="707.2"><tspan x="40" dy="0">Prerequisite</tspan></text><text x="40" y="737.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="719.2" data-bottom="820"><tspan x="40" dy="0">Directory Service Access</tspan><tspan x="40" dy="25.2">auditing + applicable SACL. A</tspan><tspan x="40" dy="25.2">SACL selects auditing; it does</tspan><tspan x="40" dy="25.2">not grant rights.</tspan></text><rect x="22" y="854" width="356" height="174" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="890" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="872" data-bottom="897.2"><tspan x="40" dy="0">Unresolved is a valid result</tspan></text><text x="40" y="927.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="909.2" data-bottom="1010"><tspan x="40" dy="0">4662 has no native client-IP</tspan><tspan x="40" dy="25.2">field. Retain candidates when</tspan><tspan x="40" dy="25.2">source enrichment is missing or</tspan><tspan x="40" dy="25.2">ambiguous.</tspan></text><rect x="22" y="1044" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1080" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1062" data-bottom="1137.6"><tspan x="39" dy="0">One matching replication right</tspan><tspan x="39" dy="25.2">does not prove successful</tspan><tspan x="39" dy="25.2">credential extraction.</tspan></text><text x="22" y="1195.6" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1181.6" data-bottom="1220.8"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

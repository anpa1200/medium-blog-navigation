<svg xmlns="http://www.w3.org/2000/svg" width="400" height="797" viewBox="0 0 400 797" role="img" aria-labelledby="title desc"><title id="title">SUNBURST: observation is not an entropy score</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: A trojanized SolarWinds component used delayed activation and encoded information in DNS names. Detection hypothesis: Correlate DNS-label structure, destination novelty and the originating process. No measured victim entropy range or universal DNS cutoff is established here.</desc><rect width="400" height="797" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">SUNBURST:</tspan><tspan x="22" dy="42">observation is not an</tspan><tspan x="22" dy="42">entropy score</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="241.2" width="356" height="174" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="277.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="259.2" data-bottom="284.4"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="314.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="296.4" data-bottom="397.2"><tspan x="40" dy="0">A trojanized SolarWinds</tspan><tspan x="40" dy="25.2">component used delayed</tspan><tspan x="40" dy="25.2">activation and encoded</tspan><tspan x="40" dy="25.2">information in DNS names.</tspan></text><rect x="22" y="431.2" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="467.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="449.2" data-bottom="474.4"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="504.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="486.4" data-bottom="562"><tspan x="40" dy="0">Correlate DNS-label structure,</tspan><tspan x="40" dy="25.2">destination novelty and the</tspan><tspan x="40" dy="25.2">originating process.</tspan></text><rect x="22" y="596" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="632" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="614" data-bottom="689.6"><tspan x="39" dy="0">No measured victim entropy</tspan><tspan x="39" dy="25.2">range or universal DNS cutoff is</tspan><tspan x="39" dy="25.2">established here.</tspan></text><text x="22" y="747.6" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="733.6" data-bottom="772.8000000000001"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

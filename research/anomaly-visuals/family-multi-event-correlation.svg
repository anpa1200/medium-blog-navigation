<svg xmlns="http://www.w3.org/2000/svg" width="800" height="807" viewBox="0 0 800 807" role="img" aria-labelledby="title desc"><title id="title">Join evidence without inventing a chain</title><desc id="desc">Multi-Event Correlation: a composition pattern, not an additional independent anomaly family. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Join tenant, account, host or session with bounded event time. Compare: Retain missing or ambiguous links; deduplicate shared evidence. Adding a gate can remove true positives as well as false positives.</desc><rect width="800" height="807" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">Join evidence without inventing a</tspan><tspan x="30" dy="53.199999999999996">chain</tspan></text><text x="30" y="204.79999999999998" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="182.79999999999998" data-bottom="213.59999999999997"><tspan x="30" dy="0">Multi-Event Correlation</tspan></text><text x="30" y="242.59999999999997" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="225.59999999999997" data-bottom="249.39999999999998"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="271.4" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="308.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="286.4" data-bottom="317.2"><tspan x="45" dy="0">Identity event</tspan></text><path d="M262 323.2 L282 323.2" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 318.2 L282 323.2 L275 328.2" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="271.4" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="308.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="286.4" data-bottom="317.2"><tspan x="301" dy="0">Process event</tspan></text><path d="M518 323.2 L538 323.2" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 318.2 L538 323.2 L531 328.2" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="271.4" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="308.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="286.4" data-bottom="348"><tspan x="557" dy="0">Application</tspan><tspan x="557" dy="30.799999999999997">event</tspan></text><text x="30" y="421" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="399" data-bottom="429.8"><tspan x="30" dy="0">Join on entity keys and time constraints—not proximity alone.</tspan></text><rect x="30" y="445.8" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="485.8" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="463.8" data-bottom="494.6"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="528.6" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="506.6" data-bottom="599"><tspan x="48" dy="0">Join tenant, account, host</tspan><tspan x="48" dy="30.799999999999997">or session with bounded</tspan><tspan x="48" dy="30.799999999999997">event time.</tspan></text><rect x="410" y="445.8" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="485.8" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="463.8" data-bottom="494.6"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="528.6" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="506.6" data-bottom="599"><tspan x="428" dy="0">Retain missing or ambiguous</tspan><tspan x="428" dy="30.799999999999997">links; deduplicate shared</tspan><tspan x="428" dy="30.799999999999997">evidence.</tspan></text><rect x="30" y="637" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="677" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="655" data-bottom="716.6"><tspan x="47" dy="0">Adding a gate can remove true positives as well as false</tspan><tspan x="47" dy="30.799999999999997">positives.</tspan></text><text x="30" y="776.6" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="760.6" data-bottom="783"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

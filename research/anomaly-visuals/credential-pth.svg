<svg xmlns="http://www.w3.org/2000/svg" width="800" height="751" viewBox="0 0 800 751" role="img" aria-labelledby="title desc"><title id="title">Pass-the-Hash: two hunting views, no single verdict</title><desc id="desc">Neither view proves PtH, and not every implementation produces both. Correlate account, source process, destination and authorized administration. Target-side view: 4624 type 3 with NTLM can describe ordinary network authentication. Source-side view: Type 9 NewCredentials with seclogo can appear in some implementations and legitimate alternate-credential workflows. The NTLM hash is not sent as the password. Context and implementation-specific evidence are required.</desc><rect width="800" height="751" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">Pass-the-Hash: two hunting views,</tspan><tspan x="30" dy="53.199999999999996">no single verdict</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">TELEMETRY MODEL · NOT CLASSIFICATION</tspan></text><rect x="30" y="228.59999999999997" width="740" height="140.39999999999998" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="48" y="268.59999999999997" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="704" data-top="246.59999999999997" data-bottom="277.4"><tspan x="48" dy="0">Target-side view</tspan></text><text x="48" y="311.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="289.4" data-bottom="351"><tspan x="48" dy="0">4624 type 3 with NTLM can describe ordinary network</tspan><tspan x="48" dy="30.799999999999997">authentication.</tspan></text><rect x="30" y="388.99999999999994" width="740" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="48" y="428.99999999999994" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="406.99999999999994" data-bottom="437.79999999999995"><tspan x="48" dy="0">Source-side view</tspan></text><text x="48" y="471.79999999999995" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="449.79999999999995" data-bottom="542.1999999999999"><tspan x="48" dy="0">Type 9 NewCredentials with seclogo can appear in some</tspan><tspan x="48" dy="30.799999999999997">implementations and legitimate alternate-credential</tspan><tspan x="48" dy="30.799999999999997">workflows.</tspan></text><rect x="30" y="580.1999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="620.1999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="598.1999999999999" data-bottom="659.8"><tspan x="47" dy="0">The NTLM hash is not sent as the password. Context and</tspan><tspan x="47" dy="30.799999999999997">implementation-specific evidence are required.</tspan></text><text x="30" y="719.8" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="703.8" data-bottom="726.1999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

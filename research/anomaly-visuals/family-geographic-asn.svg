<svg xmlns="http://www.w3.org/2000/svg" width="800" height="677" viewBox="0 0 800 677" role="img" aria-labelledby="title desc"><title id="title">Network location is uncertain</title><desc id="desc">Geographic / ASN: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Retain the source IP and enrichment version. Compare: Correlate device, session and account history. IP geolocation is not a measurement of the person’s physical location.</desc><rect width="800" height="677" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Network location is uncertain</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Geographic / ASN</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="294.79999999999995"><tspan x="45" dy="0">Identity +</tspan><tspan x="45" dy="30.799999999999997">device</tspan></text><path d="M262 270 L282 270" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 265 L282 270 L275 275" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="294.79999999999995"><tspan x="301" dy="0">VPN / proxy /</tspan><tspan x="301" dy="30.799999999999997">mobile egress</tspan></text><path d="M518 270 L538 270" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 265 L538 270 L531 275" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="294.79999999999995"><tspan x="557" dy="0">Observed IP /</tspan><tspan x="557" dy="30.799999999999997">ASN</tspan></text><rect x="30" y="345.79999999999995" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="385.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="363.79999999999995" data-bottom="394.59999999999997"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="428.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="406.59999999999997" data-bottom="468.19999999999993"><tspan x="48" dy="0">Retain the source IP and</tspan><tspan x="48" dy="30.799999999999997">enrichment version.</tspan></text><rect x="410" y="345.79999999999995" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="385.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="363.79999999999995" data-bottom="394.59999999999997"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="428.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="406.59999999999997" data-bottom="468.19999999999993"><tspan x="428" dy="0">Correlate device, session</tspan><tspan x="428" dy="30.799999999999997">and account history.</tspan></text><rect x="30" y="506.19999999999993" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="546.1999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="524.1999999999999" data-bottom="585.8"><tspan x="47" dy="0">IP geolocation is not a measurement of the person’s</tspan><tspan x="47" dy="30.799999999999997">physical location.</tspan></text><text x="30" y="645.8" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="629.8" data-bottom="652.1999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="839" viewBox="0 0 800 839" role="img" aria-labelledby="title desc"><title id="title">High entropy is not proof of tunneling</title><desc id="desc">The values are computed from the displayed strings. The maintained query is an ASCII-label feature extractor; it is not a SUNBURST detector or a universal tunneling threshold. Definition: H = −Σ p(c) log₂ p(c), in bits per character. Count characters in the selected label. Bound: For length n and alphabet A: H ≤ log₂(min(n, |A|)). Label selection and case normalization matter. abcd is structured, yet has 2 bits/character. This feature does not measure intent.</desc><rect width="800" height="839" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">High entropy is not proof of</tspan><tspan x="30" dy="53.199999999999996">tunneling</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">EXACT MATH · SYNTHETIC LABELS</tspan></text><text x="30" y="250.59999999999997" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="228.59999999999997" data-bottom="259.4"><tspan x="30" dy="0">aaaa · 0 bits/character</tspan></text><rect x="30" y="267.4" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><text x="30" y="323.4" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="301.4" data-bottom="332.2"><tspan x="30" dy="0">abab · 1 bits/character</tspan></text><rect x="30" y="340.2" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="340.2" width="370" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="30" y="396.2" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="374.2" data-bottom="405"><tspan x="30" dy="0">abcd · 2 bits/character</tspan></text><rect x="30" y="413" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="413" width="740" height="16" rx="12" fill="#8cbcff" stroke="none"/><rect x="30" y="447" width="360" height="202" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="487" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="465" data-bottom="495.8"><tspan x="48" dy="0">Definition</tspan></text><text x="48" y="529.8" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="507.8" data-bottom="631"><tspan x="48" dy="0">H = −Σ p(c) log₂ p(c), in</tspan><tspan x="48" dy="30.799999999999997">bits per character. Count</tspan><tspan x="48" dy="30.799999999999997">characters in the selected</tspan><tspan x="48" dy="30.799999999999997">label.</tspan></text><rect x="410" y="447" width="360" height="202" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="487" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="465" data-bottom="495.8"><tspan x="428" dy="0">Bound</tspan></text><text x="428" y="529.8" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="507.8" data-bottom="631"><tspan x="428" dy="0">For length n and alphabet</tspan><tspan x="428" dy="30.799999999999997">A: H ≤ log₂(min(n, |A|)).</tspan><tspan x="428" dy="30.799999999999997">Label selection and case</tspan><tspan x="428" dy="30.799999999999997">normalization matter.</tspan></text><rect x="30" y="669" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="709" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="687" data-bottom="748.6"><tspan x="47" dy="0">abcd is structured, yet has 2 bits/character. This feature</tspan><tspan x="47" dy="30.799999999999997">does not measure intent.</tspan></text><text x="30" y="808.6" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="792.6" data-bottom="815"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

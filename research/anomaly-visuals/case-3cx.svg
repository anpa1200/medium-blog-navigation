<svg xmlns="http://www.w3.org/2000/svg" width="800" height="781" viewBox="0 0 800 781" role="img" aria-labelledby="title desc"><title id="title">3CX: a signature is not a benign verdict</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: SentinelOne reported behavioral detections before public disclosure. GitHub-hosted icons carried encoded C2 information in the Windows chain. Detection hypothesis: Investigate new destinations and later execution associated with a normally trusted application. The icons were not described as executable payloads. Vendor-reported detection is not an independent EDR benchmark.</desc><rect width="800" height="781" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">3CX: a signature is not a benign</tspan><tspan x="30" dy="53.199999999999996">verdict</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="30" y="228.59999999999997" width="740" height="171.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="48" y="268.59999999999997" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="704" data-top="246.59999999999997" data-bottom="277.4"><tspan x="48" dy="0">Source-reported</tspan></text><text x="48" y="311.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="289.4" data-bottom="381.79999999999995"><tspan x="48" dy="0">SentinelOne reported behavioral detections before public</tspan><tspan x="48" dy="30.799999999999997">disclosure. GitHub-hosted icons carried encoded C2</tspan><tspan x="48" dy="30.799999999999997">information in the Windows chain.</tspan></text><rect x="30" y="419.79999999999995" width="740" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="48" y="459.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="437.79999999999995" data-bottom="468.59999999999997"><tspan x="48" dy="0">Detection hypothesis</tspan></text><text x="48" y="502.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="480.59999999999997" data-bottom="542.1999999999999"><tspan x="48" dy="0">Investigate new destinations and later execution</tspan><tspan x="48" dy="30.799999999999997">associated with a normally trusted application.</tspan></text><rect x="30" y="580.1999999999999" width="740" height="132.39999999999998" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="620.1999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="598.1999999999999" data-bottom="690.5999999999999"><tspan x="47" dy="0">The icons were not described as executable payloads.</tspan><tspan x="47" dy="30.799999999999997">Vendor-reported detection is not an independent EDR</tspan><tspan x="47" dy="30.799999999999997">benchmark.</tspan></text><text x="30" y="750.5999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="734.5999999999999" data-bottom="756.9999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

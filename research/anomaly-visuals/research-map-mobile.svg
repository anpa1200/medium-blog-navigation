<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1318" viewBox="0 0 400 1318" role="img" aria-labelledby="title desc"><title id="title">From anomaly to investigation</title><desc id="desc">A detection-engineering workflow, not a chronological attack lifecycle. Validation and analyst judgment are required before operational action. Observe: Collect an event or change. Compare: Use a defined baseline. Corroborate: Check entity and context. Investigate: Test competing explanations. Scope: 14 operational families + multi-event correlation. These are overlapping analytical views. Evidence boundary: Incident reports, functional tests and synthetic statistics answer different questions. An anomaly is a lead, not an intrusion verdict or actor attribution.</desc><rect width="400" height="1318" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">From anomaly to</tspan><tspan x="22" dy="42">investigation</tspan></text><text x="22" y="175.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="157.6" data-bottom="208"><tspan x="22" dy="0">Malicious Activity as a Statistical</tspan><tspan x="22" dy="25.2">Signal</tspan></text><text x="22" y="234" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="220" data-bottom="239.6"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="261.6" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="294.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="276.6" data-bottom="301.8"><tspan x="37" dy="0">Observe</tspan></text><text x="37" y="331.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="313.8" data-bottom="339"><tspan x="37" dy="0">Collect an event or change.</tspan></text><path d="M200 358 L200 394" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 387 L200 394 L205 387" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="398" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="431" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="413" data-bottom="438.2"><tspan x="37" dy="0">Compare</tspan></text><text x="37" y="468.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="450.2" data-bottom="475.4"><tspan x="37" dy="0">Use a defined baseline.</tspan></text><path d="M200 494.4 L200 530.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 523.4 L200 530.4 L205 523.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="534.4000000000001" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="567.4000000000001" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="549.4000000000001" data-bottom="574.6000000000001"><tspan x="37" dy="0">Corroborate</tspan></text><text x="37" y="604.6000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="586.6000000000001" data-bottom="611.8000000000002"><tspan x="37" dy="0">Check entity and context.</tspan></text><path d="M200 630.8000000000001 L200 666.8000000000001" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 659.8000000000001 L200 666.8000000000001 L205 659.8000000000001" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="670.8000000000001" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="703.8000000000001" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="685.8000000000001" data-bottom="711.0000000000001"><tspan x="37" dy="0">Investigate</tspan></text><text x="37" y="741.0000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="723.0000000000001" data-bottom="748.2000000000002"><tspan x="37" dy="0">Test competing explanations.</tspan></text><rect x="22" y="787.2" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="823.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="805.2" data-bottom="830.4000000000001"><tspan x="40" dy="0">Scope</tspan></text><text x="40" y="860.4000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="842.4000000000001" data-bottom="918.0000000000001"><tspan x="40" dy="0">14 operational families +</tspan><tspan x="40" dy="25.2">multi-event correlation. These</tspan><tspan x="40" dy="25.2">are overlapping analytical views.</tspan></text><rect x="22" y="952" width="356" height="148.8" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="988" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="970" data-bottom="995.2"><tspan x="40" dy="0">Evidence boundary</tspan></text><text x="40" y="1025.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="1007.2" data-bottom="1082.8"><tspan x="40" dy="0">Incident reports, functional</tspan><tspan x="40" dy="25.2">tests and synthetic statistics</tspan><tspan x="40" dy="25.2">answer different questions.</tspan></text><rect x="22" y="1116.8" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1152.8" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1134.8" data-bottom="1210.3999999999999"><tspan x="39" dy="0">An anomaly is a lead, not an</tspan><tspan x="39" dy="25.2">intrusion verdict or actor</tspan><tspan x="39" dy="25.2">attribution.</tspan></text><text x="22" y="1268.3999999999999" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1254.3999999999999" data-bottom="1293.6"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

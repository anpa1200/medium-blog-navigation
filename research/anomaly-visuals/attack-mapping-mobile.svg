<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1186" viewBox="0 0 400 1186" role="img" aria-labelledby="title desc"><title id="title">Map behavior, then ask what is measurable</title><desc id="desc">The article’s tactic matrix is a set of proposed observation opportunities. It is not a ranking of detector performance. Observed behavior: Keep the source and its limits. ATT&amp;CK mapping: Explain why the behavior fits. Candidate feature: Name fields, units and context. ATT&amp;CK v19.2 context: The v19 split created Stealth and Defense Impairment. Tactics are not a required time sequence. Do not infer: An anomaly tag is neither a technique verdict, a group identity nor measured detection coverage. These are analytical relationships, not a guaranteed attack progression.</desc><rect width="400" height="1186" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Map behavior, then</tspan><tspan x="22" dy="42">ask what is</tspan><tspan x="22" dy="42">measurable</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="241.2" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="274.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="256.2" data-bottom="281.4"><tspan x="37" dy="0">Observed behavior</tspan></text><text x="37" y="311.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="293.4" data-bottom="318.59999999999997"><tspan x="37" dy="0">Keep the source and its limits.</tspan></text><path d="M200 337.6 L200 373.6" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 366.6 L200 373.6 L205 366.6" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="377.6" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="410.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="392.6" data-bottom="417.8"><tspan x="37" dy="0">ATT&amp;CK mapping</tspan></text><text x="37" y="447.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="429.8" data-bottom="455"><tspan x="37" dy="0">Explain why the behavior fits.</tspan></text><path d="M200 474 L200 510" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 503 L200 510 L205 503" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="514" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="547" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="529" data-bottom="554.2"><tspan x="37" dy="0">Candidate feature</tspan></text><text x="37" y="584.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="566.2" data-bottom="591.4000000000001"><tspan x="37" dy="0">Name fields, units and context.</tspan></text><rect x="22" y="630.4000000000001" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="666.4000000000001" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="648.4000000000001" data-bottom="673.6000000000001"><tspan x="40" dy="0">ATT&amp;CK v19.2 context</tspan></text><text x="40" y="703.6000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="685.6000000000001" data-bottom="786.4000000000001"><tspan x="40" dy="0">The v19 split created Stealth</tspan><tspan x="40" dy="25.2">and Defense Impairment. Tactics</tspan><tspan x="40" dy="25.2">are not a required time</tspan><tspan x="40" dy="25.2">sequence.</tspan></text><rect x="22" y="795.2" width="356" height="174" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="831.2" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="813.2" data-bottom="838.4000000000001"><tspan x="40" dy="0">Do not infer</tspan></text><text x="40" y="868.4000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="850.4000000000001" data-bottom="951.2"><tspan x="40" dy="0">An anomaly tag is neither a</tspan><tspan x="40" dy="25.2">technique verdict, a group</tspan><tspan x="40" dy="25.2">identity nor measured detection</tspan><tspan x="40" dy="25.2">coverage.</tspan></text><rect x="22" y="985.2" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1021.2" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1003.2" data-bottom="1078.8"><tspan x="39" dy="0">These are analytical</tspan><tspan x="39" dy="25.2">relationships, not a guaranteed</tspan><tspan x="39" dy="25.2">attack progression.</tspan></text><text x="22" y="1136.8" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1122.8" data-bottom="1162"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="804" viewBox="0 0 800 804" role="img" aria-labelledby="title desc"><title id="title">How often did it happen?</title><desc id="desc">Frequency / Rate: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Count occurrences and state the time denominator. Compare: Evaluate rate with source and target diversity. Retries, polling and releases can create bursts; sparse attacks may not.</desc><rect width="800" height="804" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">How often did it happen?</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Frequency / Rate</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="740" height="200" rx="12" fill="#14233b" stroke="none"/><text x="48" y="258.2" fill="#c4d2e8" font-size="20" font-weight="400" data-max-width="704" data-top="238.2" data-bottom="266.2"><tspan x="48" dy="0">Window A</tspan></text><circle cx="56" cy="283.2" r="6" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="132.66666666666669" cy="283.2" r="6" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="209.33333333333334" cy="283.2" r="6" fill="#8cbcff" stroke="none" stroke-width="2"/><text x="48" y="330.2" fill="#c4d2e8" font-size="20" font-weight="400" data-max-width="704" data-top="310.2" data-bottom="338.2"><tspan x="48" dy="0">Window B</tspan></text><circle cx="56" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="132.66666666666669" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="209.33333333333334" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="286" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="362.6666666666667" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="439.3333333333333" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="516" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="592.6666666666666" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="669.3333333333334" cy="355.2" r="6" fill="#ffcd7a" stroke="none" stroke-width="2"/><text x="48" y="396.2" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="704" data-top="378.2" data-bottom="403.4"><tspan x="48" dy="0">Equal duration; dots represent events.</tspan></text><text x="30" y="450.2" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="740" data-top="432.2" data-bottom="457.4"><tspan x="30" dy="0">Illustrative geometry only; no measured scale or operational threshold.</tspan></text><rect x="30" y="473.4" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="513.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="491.4" data-bottom="522.1999999999999"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="556.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="534.1999999999999" data-bottom="626.5999999999999"><tspan x="48" dy="0">Count occurrences and</tspan><tspan x="48" dy="30.799999999999997">state the time</tspan><tspan x="48" dy="30.799999999999997">denominator.</tspan></text><rect x="410" y="473.4" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="513.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="491.4" data-bottom="522.1999999999999"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="556.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="534.1999999999999" data-bottom="595.8"><tspan x="428" dy="0">Evaluate rate with source</tspan><tspan x="428" dy="30.799999999999997">and target diversity.</tspan></text><rect x="30" y="633.8" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="673.8" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="651.8" data-bottom="713.4"><tspan x="47" dy="0">Retries, polling and releases can create bursts; sparse</tspan><tspan x="47" dy="30.799999999999997">attacks may not.</tspan></text><text x="30" y="773.4" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="757.4" data-bottom="779.8"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

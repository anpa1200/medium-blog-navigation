<svg xmlns="http://www.w3.org/2000/svg" width="400" height="989" viewBox="0 0 400 989" role="img" aria-labelledby="title desc"><title id="title">Rare does not mean malicious</title><desc id="desc">Rare Process / Service: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Measure prevalence within a role and observation window. Compare: Check signer, hash, owner and collection coverage. New software, diagnostics and newly enabled telemetry can all look rare.</desc><rect width="400" height="989" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Rare does not mean</tspan><tspan x="22" dy="42">malicious</tspan></text><text x="22" y="175.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="157.6" data-bottom="182.79999999999998"><tspan x="22" dy="0">Rare Process / Service</tspan></text><text x="22" y="208.8" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="194.8" data-bottom="214.4"><tspan x="22" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="22" y="236.4" width="356" height="200" rx="12" fill="#14233b" stroke="none"/><circle cx="52" cy="286.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="111.2" cy="286.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="170.4" cy="286.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="229.6" cy="286.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="288.8" cy="286.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="348" cy="286.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="52" cy="331.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="111.2" cy="331.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="170.4" cy="331.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="229.6" cy="331.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="288.8" cy="331.4" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="348" cy="331.4" r="9" fill="#ffcd7a" stroke="none" stroke-width="2"/><text x="42" y="382.4" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="316" data-top="364.4" data-bottom="414.79999999999995"><tspan x="42" dy="0">Define cohort membership</tspan><tspan x="42" dy="25.2">before comparing.</tspan></text><text x="22" y="465.4" fill="#c4d2e8" font-size="15" font-weight="400" data-max-width="356" data-top="450.4" data-bottom="492.4"><tspan x="22" dy="0">Illustrative geometry only; no measured</tspan><tspan x="22" dy="21">scale or operational threshold.</tspan></text><rect x="22" y="508.4" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="544.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="526.4" data-bottom="551.6"><tspan x="40" dy="0">Measure</tspan></text><text x="40" y="581.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="563.6" data-bottom="614"><tspan x="40" dy="0">Measure prevalence within a role</tspan><tspan x="40" dy="25.2">and observation window.</tspan></text><rect x="22" y="648" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="684" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="666" data-bottom="691.2"><tspan x="40" dy="0">Compare</tspan></text><text x="40" y="721.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="703.2" data-bottom="753.6"><tspan x="40" dy="0">Check signer, hash, owner and</tspan><tspan x="40" dy="25.2">collection coverage.</tspan></text><rect x="22" y="787.6" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="823.6" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="805.6" data-bottom="881.2"><tspan x="39" dy="0">New software, diagnostics and</tspan><tspan x="39" dy="25.2">newly enabled telemetry can all</tspan><tspan x="39" dy="25.2">look rare.</tspan></text><text x="22" y="939.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="925.2" data-bottom="964.4000000000001"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="779" viewBox="0 0 800 779" role="img" aria-labelledby="title desc"><title id="title">LSASS process access needs provenance</title><desc id="desc">Bitmask meanings are separate from malicious intent. A familiar filename, signer or directory is not a universal safe exclusion. Sysmon 10: Source, target, time and access mask. Process context: Signer, hash, ancestry and call trace. Investigation: Compare authorized security and diagnostic tools. 0x1010: VM read + limited query information. 0x1410: The same rights plus query information. An access mask or unresolved call trace alone does not establish dumping or injection.</desc><rect width="800" height="779" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">LSASS process access needs</tspan><tspan x="30" dy="53.199999999999996">provenance</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="228.59999999999997" width="228" height="196" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="274.4"><tspan x="45" dy="0">Sysmon 10</tspan></text><text x="45" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="286.4" data-bottom="378.79999999999995"><tspan x="45" dy="0">Source, target,</tspan><tspan x="45" dy="30.799999999999997">time and access</tspan><tspan x="45" dy="30.799999999999997">mask.</tspan></text><path d="M262 326.59999999999997 L282 326.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 321.59999999999997 L282 326.59999999999997 L275 331.59999999999997" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="228.59999999999997" width="228" height="196" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="305.19999999999993"><tspan x="301" dy="0">Process</tspan><tspan x="301" dy="30.799999999999997">context</tspan></text><text x="301" y="339.19999999999993" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="317.19999999999993" data-bottom="409.5999999999999"><tspan x="301" dy="0">Signer, hash,</tspan><tspan x="301" dy="30.799999999999997">ancestry and</tspan><tspan x="301" dy="30.799999999999997">call trace.</tspan></text><path d="M518 326.59999999999997 L538 326.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 321.59999999999997 L538 326.59999999999997 L531 331.59999999999997" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="228.59999999999997" width="228" height="196" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="274.4"><tspan x="557" dy="0">Investigation</tspan></text><text x="557" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="286.4" data-bottom="440.4"><tspan x="557" dy="0">Compare</tspan><tspan x="557" dy="30.799999999999997">authorized</tspan><tspan x="557" dy="30.799999999999997">security and</tspan><tspan x="557" dy="30.799999999999997">diagnostic</tspan><tspan x="557" dy="30.799999999999997">tools.</tspan></text><rect x="30" y="448.59999999999997" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="488.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="466.59999999999997" data-bottom="497.4"><tspan x="48" dy="0">0x1010</tspan></text><text x="48" y="531.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="509.4" data-bottom="571"><tspan x="48" dy="0">VM read + limited query</tspan><tspan x="48" dy="30.799999999999997">information.</tspan></text><rect x="410" y="448.59999999999997" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="488.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="466.59999999999997" data-bottom="497.4"><tspan x="428" dy="0">0x1410</tspan></text><text x="428" y="531.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="509.4" data-bottom="571"><tspan x="428" dy="0">The same rights plus query</tspan><tspan x="428" dy="30.799999999999997">information.</tspan></text><rect x="30" y="609" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="649" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="627" data-bottom="688.6"><tspan x="47" dy="0">An access mask or unresolved call trace alone does not</tspan><tspan x="47" dy="30.799999999999997">establish dumping or injection.</tspan></text><text x="30" y="748.6" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="732.6" data-bottom="755"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

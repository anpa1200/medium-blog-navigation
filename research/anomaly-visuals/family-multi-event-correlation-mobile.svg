<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1097" viewBox="0 0 400 1097" role="img" aria-labelledby="title desc"><title id="title">Join evidence without inventing a chain</title><desc id="desc">Multi-Event Correlation: a composition pattern, not an additional independent anomaly family. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Join tenant, account, host or session with bounded event time. Compare: Retain missing or ambiguous links; deduplicate shared evidence. Adding a gate can remove true positives as well as false positives.</desc><rect width="400" height="1097" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Join evidence without</tspan><tspan x="22" dy="42">inventing a chain</tspan></text><text x="22" y="175.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="157.6" data-bottom="182.79999999999998"><tspan x="22" dy="0">Multi-Event Correlation</tspan></text><text x="22" y="208.8" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="194.8" data-bottom="214.4"><tspan x="22" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="22" y="236.4" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="269.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="251.4" data-bottom="276.6"><tspan x="37" dy="0">Identity event</tspan></text><path d="M200 307.6 L200 343.6" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 336.6 L200 343.6 L205 336.6" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="347.6" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="380.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="362.6" data-bottom="387.8"><tspan x="37" dy="0">Process event</tspan></text><path d="M200 418.8 L200 454.8" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 447.8 L200 454.8 L205 447.8" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="458.8" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="491.8" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="473.8" data-bottom="499"><tspan x="37" dy="0">Application event</tspan></text><text x="22" y="568" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="550" data-bottom="600.4"><tspan x="22" dy="0">Join on entity keys and time</tspan><tspan x="22" dy="25.2">constraints—not proximity alone.</tspan></text><rect x="22" y="616.4" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="652.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="634.4" data-bottom="659.6"><tspan x="40" dy="0">Measure</tspan></text><text x="40" y="689.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="671.6" data-bottom="722"><tspan x="40" dy="0">Join tenant, account, host or</tspan><tspan x="40" dy="25.2">session with bounded event time.</tspan></text><rect x="22" y="756" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="792" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="774" data-bottom="799.2"><tspan x="40" dy="0">Compare</tspan></text><text x="40" y="829.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="811.2" data-bottom="886.8000000000001"><tspan x="40" dy="0">Retain missing or ambiguous</tspan><tspan x="40" dy="25.2">links; deduplicate shared</tspan><tspan x="40" dy="25.2">evidence.</tspan></text><rect x="22" y="895.6" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="931.6" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="913.6" data-bottom="989.2"><tspan x="39" dy="0">Adding a gate can remove true</tspan><tspan x="39" dy="25.2">positives as well as false</tspan><tspan x="39" dy="25.2">positives.</tspan></text><text x="22" y="1047.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1033.2" data-bottom="1072.4"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

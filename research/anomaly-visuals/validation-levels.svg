<svg xmlns="http://www.w3.org/2000/svg" width="800" height="926" viewBox="0 0 800 926" role="img" aria-labelledby="title desc"><title id="title">What the tests actually establish</title><desc id="desc">Counts are read from the committed execution report, not rerun by drawing the figure. The zero-match Kerberoasting case remains visible. Query output rows are candidates, not labeled true positives. Production accuracy is not established.</desc><rect width="800" height="926" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">What the tests actually establish</tspan></text><text x="30" y="146.6" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="129.6" data-bottom="153.39999999999998"><tspan x="30" dy="0">RECORDED RESULTS · SCOPED CLAIMS</tspan></text><rect x="30" y="175.39999999999998" width="360" height="171.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="48" y="215.39999999999998" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="324" data-top="193.39999999999998" data-bottom="224.2"><tspan x="48" dy="0">34/34 KQL cases</tspan></text><text x="48" y="258.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="236.2" data-bottom="328.59999999999997"><tspan x="48" dy="0">Synthetic functional</tspan><tspan x="48" dy="30.799999999999997">regression cases passed in</tspan><tspan x="48" dy="30.799999999999997">the recorded engine run.</tspan></text><rect x="410" y="175.39999999999998" width="360" height="171.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="428" y="215.39999999999998" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="324" data-top="193.39999999999998" data-bottom="224.2"><tspan x="428" dy="0">8/8 offline checks</tspan></text><text x="428" y="258.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="236.2" data-bottom="328.59999999999997"><tspan x="428" dy="0">Counterexamples passed.</tspan><tspan x="428" dy="30.799999999999997">These are not an accuracy</tspan><tspan x="428" dy="30.799999999999997">estimate.</tspan></text><rect x="30" y="366.59999999999997" width="740" height="109.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="406.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="384.59999999999997" data-bottom="415.4"><tspan x="48" dy="0">dcsync</tspan></text><text x="48" y="449.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="427.4" data-bottom="458.2"><tspan x="48" dy="0">11 input records → 4 query output rows</tspan></text><rect x="30" y="496.19999999999993" width="740" height="109.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="536.1999999999999" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="514.1999999999999" data-bottom="544.9999999999999"><tspan x="48" dy="0">lsass-access</tspan></text><text x="48" y="578.9999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="556.9999999999999" data-bottom="587.7999999999998"><tspan x="48" dy="0">32 input records → 24 query output rows</tspan></text><rect x="30" y="625.8" width="740" height="109.6" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="48" y="665.8" fill="#ffcd7a" font-size="22" font-weight="700" data-max-width="704" data-top="643.8" data-bottom="674.5999999999999"><tspan x="48" dy="0">kerberoasting</tspan></text><text x="48" y="708.5999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="686.5999999999999" data-bottom="717.3999999999999"><tspan x="48" dy="0">1 input records → 0 query output rows</tspan></text><rect x="30" y="755.4" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="795.4" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="773.4" data-bottom="835"><tspan x="47" dy="0">Query output rows are candidates, not labeled true</tspan><tspan x="47" dy="30.799999999999997">positives. Production accuracy is not established.</tspan></text><text x="30" y="895" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="879" data-bottom="901.4"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

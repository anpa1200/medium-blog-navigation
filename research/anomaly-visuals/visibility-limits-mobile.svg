<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1356" viewBox="0 0 400 1356" role="img" aria-labelledby="title desc"><title id="title">A detector can miss at different layers</title><desc id="desc">Different failure layers require different remedies. More complex scoring cannot recover events the pipeline never collected. Behavior: Low-rate or in-process activity. Sensor: Wrong position or missing source. Data pipeline: Drops, filters, clock or parser errors. Model: Wrong cohort or contaminated baseline. Investigate the layer: Record which assumption failed and test an alternative source or analytic. Avoid circular reasoning: A missing alert does not prove intentional evasion or absence of compromise. This is a diagnostic map, not a sourced chronology for any particular actor.</desc><rect width="400" height="1356" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">A detector can miss</tspan><tspan x="22" dy="42">at different layers</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="199.2" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="232.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="214.2" data-bottom="239.39999999999998"><tspan x="37" dy="0">Behavior</tspan></text><text x="37" y="269.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="251.39999999999998" data-bottom="276.59999999999997"><tspan x="37" dy="0">Low-rate or in-process activity.</tspan></text><path d="M200 320.79999999999995 L200 356.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 349.79999999999995 L200 356.79999999999995 L205 349.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="360.79999999999995" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="393.79999999999995" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="375.79999999999995" data-bottom="400.99999999999994"><tspan x="37" dy="0">Sensor</tspan></text><text x="37" y="430.99999999999994" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="412.99999999999994" data-bottom="438.19999999999993"><tspan x="37" dy="0">Wrong position or missing source.</tspan></text><path d="M200 482.4 L200 518.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 511.4 L200 518.4 L205 511.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="522.4" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="555.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="537.4" data-bottom="562.6"><tspan x="37" dy="0">Data pipeline</tspan></text><text x="37" y="592.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="574.6" data-bottom="625"><tspan x="37" dy="0">Drops, filters, clock or parser</tspan><tspan x="37" dy="25.2">errors.</tspan></text><path d="M200 644 L200 680" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 673 L200 680 L205 673" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="684" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="717" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="699" data-bottom="724.2"><tspan x="37" dy="0">Model</tspan></text><text x="37" y="754.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="736.2" data-bottom="786.6"><tspan x="37" dy="0">Wrong cohort or contaminated</tspan><tspan x="37" dy="25.2">baseline.</tspan></text><rect x="22" y="825.5999999999999" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="861.5999999999999" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="843.5999999999999" data-bottom="868.8"><tspan x="40" dy="0">Investigate the layer</tspan></text><text x="40" y="898.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="880.8" data-bottom="956.4"><tspan x="40" dy="0">Record which assumption failed</tspan><tspan x="40" dy="25.2">and test an alternative source</tspan><tspan x="40" dy="25.2">or analytic.</tspan></text><rect x="22" y="990.3999999999999" width="356" height="148.8" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="1026.3999999999999" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="1008.3999999999999" data-bottom="1033.6"><tspan x="40" dy="0">Avoid circular reasoning</tspan></text><text x="40" y="1063.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="1045.6" data-bottom="1121.1999999999998"><tspan x="40" dy="0">A missing alert does not prove</tspan><tspan x="40" dy="25.2">intentional evasion or absence</tspan><tspan x="40" dy="25.2">of compromise.</tspan></text><rect x="22" y="1155.1999999999998" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1191.1999999999998" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1173.1999999999998" data-bottom="1248.7999999999997"><tspan x="39" dy="0">This is a diagnostic map, not a</tspan><tspan x="39" dy="25.2">sourced chronology for any</tspan><tspan x="39" dy="25.2">particular actor.</tspan></text><text x="22" y="1306.7999999999997" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1292.7999999999997" data-bottom="1331.9999999999998"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

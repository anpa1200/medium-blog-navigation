<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1149" viewBox="0 0 400 1149" role="img" aria-labelledby="title desc"><title id="title">What the tests actually establish</title><desc id="desc">Counts are read from the committed execution report, not rerun by drawing the figure. The zero-match Kerberoasting case remains visible. Query output rows are candidates, not labeled true positives. Production accuracy is not established.</desc><rect width="400" height="1149" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">What the tests</tspan><tspan x="22" dy="42">actually establish</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">RECORDED RESULTS · SCOPED CLAIMS</tspan></text><rect x="22" y="199.2" width="356" height="148.8" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="235.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="217.2" data-bottom="242.39999999999998"><tspan x="40" dy="0">34/34 KQL cases</tspan></text><text x="40" y="272.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="254.39999999999998" data-bottom="330"><tspan x="40" dy="0">Synthetic functional regression</tspan><tspan x="40" dy="25.2">cases passed in the recorded</tspan><tspan x="40" dy="25.2">engine run.</tspan></text><rect x="22" y="364" width="356" height="123.6" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="400" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="382" data-bottom="407.2"><tspan x="40" dy="0">8/8 offline checks</tspan></text><text x="40" y="437.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="419.2" data-bottom="469.59999999999997"><tspan x="40" dy="0">Counterexamples passed. These</tspan><tspan x="40" dy="25.2">are not an accuracy estimate.</tspan></text><rect x="22" y="503.6" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="539.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="521.6" data-bottom="546.8000000000001"><tspan x="40" dy="0">dcsync</tspan></text><text x="40" y="576.8000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="558.8000000000001" data-bottom="609.2"><tspan x="40" dy="0">11 input records → 4 query</tspan><tspan x="40" dy="25.2">output rows</tspan></text><rect x="22" y="643.2" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="679.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="661.2" data-bottom="686.4000000000001"><tspan x="40" dy="0">lsass-access</tspan></text><text x="40" y="716.4000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="698.4000000000001" data-bottom="748.8000000000001"><tspan x="40" dy="0">32 input records → 24 query</tspan><tspan x="40" dy="25.2">output rows</tspan></text><rect x="22" y="782.8000000000001" width="356" height="123.6" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="818.8000000000001" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="800.8000000000001" data-bottom="826.0000000000001"><tspan x="40" dy="0">kerberoasting</tspan></text><text x="40" y="856.0000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="838.0000000000001" data-bottom="888.4000000000001"><tspan x="40" dy="0">1 input records → 0 query</tspan><tspan x="40" dy="25.2">output rows</tspan></text><rect x="22" y="922.4000000000001" width="356" height="140.8" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="958.4000000000001" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="940.4000000000001" data-bottom="1041.2"><tspan x="39" dy="0">Query output rows are</tspan><tspan x="39" dy="25.2">candidates, not labeled true</tspan><tspan x="39" dy="25.2">positives. Production accuracy</tspan><tspan x="39" dy="25.2">is not established.</tspan></text><text x="22" y="1099.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1085.2" data-bottom="1124.4"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

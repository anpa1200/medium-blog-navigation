<svg xmlns="http://www.w3.org/2000/svg" width="800" height="841" viewBox="0 0 800 841" role="img" aria-labelledby="title desc"><title id="title">DCSync: keep source correlation honest</title><desc id="desc">Arrows show an enrichment workflow, not the temporal order of the Windows events. Approved replication needs scoped inventory-backed context, not a name-based exemption. 4662 on the DC: Audited replication-right access. Bounded join: Same DC + normalized logon ID + event time. 4624 context: Use a suitable matching logon, if available. Prerequisite: Directory Service Access auditing + applicable SACL. A SACL selects auditing; it does not grant rights. Unresolved is a valid result: 4662 has no native client-IP field. Retain candidates when source enrichment is missing or ambiguous. One matching replication right does not prove successful credential extraction.</desc><rect width="800" height="841" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">DCSync: keep source correlation</tspan><tspan x="30" dy="53.199999999999996">honest</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="228.59999999999997" width="228" height="165.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="274.4"><tspan x="45" dy="0">4662 on the DC</tspan></text><text x="45" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="286.4" data-bottom="378.79999999999995"><tspan x="45" dy="0">Audited</tspan><tspan x="45" dy="30.799999999999997">replication-righ</tspan><tspan x="45" dy="30.799999999999997">t access.</tspan></text><path d="M262 311.19999999999993 L282 311.19999999999993" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 306.19999999999993 L282 311.19999999999993 L275 316.19999999999993" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="228.59999999999997" width="228" height="165.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="274.4"><tspan x="301" dy="0">Bounded join</tspan></text><text x="301" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="286.4" data-bottom="378.79999999999995"><tspan x="301" dy="0">Same DC +</tspan><tspan x="301" dy="30.799999999999997">normalized logon</tspan><tspan x="301" dy="30.799999999999997">ID + event time.</tspan></text><path d="M518 311.19999999999993 L538 311.19999999999993" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 306.19999999999993 L538 311.19999999999993 L531 316.19999999999993" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="228.59999999999997" width="228" height="165.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="274.4"><tspan x="557" dy="0">4624 context</tspan></text><text x="557" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="286.4" data-bottom="378.79999999999995"><tspan x="557" dy="0">Use a suitable</tspan><tspan x="557" dy="30.799999999999997">matching logon,</tspan><tspan x="557" dy="30.799999999999997">if available.</tspan></text><rect x="30" y="417.79999999999995" width="360" height="232.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="457.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="435.79999999999995" data-bottom="466.59999999999997"><tspan x="48" dy="0">Prerequisite</tspan></text><text x="48" y="500.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="478.59999999999997" data-bottom="601.8"><tspan x="48" dy="0">Directory Service Access</tspan><tspan x="48" dy="30.799999999999997">auditing + applicable SACL.</tspan><tspan x="48" dy="30.799999999999997">A SACL selects auditing; it</tspan><tspan x="48" dy="30.799999999999997">does not grant rights.</tspan></text><rect x="410" y="417.79999999999995" width="360" height="232.8" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="428" y="457.79999999999995" fill="#ffcd7a" font-size="22" font-weight="700" data-max-width="324" data-top="435.79999999999995" data-bottom="466.59999999999997"><tspan x="428" dy="0">Unresolved is a valid result</tspan></text><text x="428" y="500.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="478.59999999999997" data-bottom="632.5999999999999"><tspan x="428" dy="0">4662 has no native</tspan><tspan x="428" dy="30.799999999999997">client-IP field. Retain</tspan><tspan x="428" dy="30.799999999999997">candidates when source</tspan><tspan x="428" dy="30.799999999999997">enrichment is missing or</tspan><tspan x="428" dy="30.799999999999997">ambiguous.</tspan></text><rect x="30" y="670.5999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="710.5999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="688.5999999999999" data-bottom="750.1999999999999"><tspan x="47" dy="0">One matching replication right does not prove successful</tspan><tspan x="47" dy="30.799999999999997">credential extraction.</tspan></text><text x="30" y="810.1999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="794.1999999999999" data-bottom="816.5999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

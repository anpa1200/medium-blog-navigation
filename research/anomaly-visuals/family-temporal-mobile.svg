<svg xmlns="http://www.w3.org/2000/svg" width="400" height="989" viewBox="0 0 400 989" role="img" aria-labelledby="title desc"><title id="title">Does the timing fit the task?</title><desc id="desc">Temporal: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Preserve event time, time zone, shift and schedule. Compare: Compare equivalent calendar periods, not just clock hours. On-call work, travel and daylight-saving changes can explain timing.</desc><rect width="400" height="989" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Does the timing fit</tspan><tspan x="22" dy="42">the task?</tspan></text><text x="22" y="175.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="157.6" data-bottom="182.79999999999998"><tspan x="22" dy="0">Temporal</tspan></text><text x="22" y="208.8" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="194.8" data-bottom="214.4"><tspan x="22" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="22" y="236.4" width="356" height="200" rx="12" fill="#14233b" stroke="none"/><rect x="44" y="298.4" width="312" height="40" rx="12" fill="#233653" stroke="none"/><rect x="115.76" y="298.4" width="124.80000000000001" height="40" rx="12" fill="#216057" stroke="none"/><circle cx="306.08" cy="318.4" r="10" fill="#ffcd7a" stroke="none" stroke-width="2"/><text x="42" y="379.4" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="316" data-top="361.4" data-bottom="411.79999999999995"><tspan x="42" dy="0">Usual schedule band + event</tspan><tspan x="42" dy="25.2">outside it</tspan></text><text x="22" y="465.4" fill="#c4d2e8" font-size="15" font-weight="400" data-max-width="356" data-top="450.4" data-bottom="492.4"><tspan x="22" dy="0">Illustrative geometry only; no measured</tspan><tspan x="22" dy="21">scale or operational threshold.</tspan></text><rect x="22" y="508.4" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="544.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="526.4" data-bottom="551.6"><tspan x="40" dy="0">Measure</tspan></text><text x="40" y="581.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="563.6" data-bottom="614"><tspan x="40" dy="0">Preserve event time, time zone,</tspan><tspan x="40" dy="25.2">shift and schedule.</tspan></text><rect x="22" y="648" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="684" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="666" data-bottom="691.2"><tspan x="40" dy="0">Compare</tspan></text><text x="40" y="721.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="703.2" data-bottom="753.6"><tspan x="40" dy="0">Compare equivalent calendar</tspan><tspan x="40" dy="25.2">periods, not just clock hours.</tspan></text><rect x="22" y="787.6" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="823.6" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="805.6" data-bottom="881.2"><tspan x="39" dy="0">On-call work, travel and</tspan><tspan x="39" dy="25.2">daylight-saving changes can</tspan><tspan x="39" dy="25.2">explain timing.</tspan></text><text x="22" y="939.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="925.2" data-bottom="964.4000000000001"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

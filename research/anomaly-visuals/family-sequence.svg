<svg xmlns="http://www.w3.org/2000/svg" width="800" height="707" viewBox="0 0 800 707" role="img" aria-labelledby="title desc"><title id="title">Order adds context</title><desc id="desc">Sequence: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Join a defined entity or session across ordered events. Compare: Declare permitted gaps, missing steps and late arrival. This illustrative workflow can also be legitimate; timing alone is not causality.</desc><rect width="800" height="707" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Order adds context</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Sequence</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="264"><tspan x="45" dy="0">Authentication</tspan></text><path d="M262 270 L282 270" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 265 L282 270 L275 275" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="294.79999999999995"><tspan x="301" dy="0">Permission</tspan><tspan x="301" dy="30.799999999999997">change</tspan></text><path d="M518 270 L538 270" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 265 L538 270 L531 275" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="294.79999999999995"><tspan x="557" dy="0">Sensitive</tspan><tspan x="557" dy="30.799999999999997">access</tspan></text><rect x="30" y="345.79999999999995" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="385.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="363.79999999999995" data-bottom="394.59999999999997"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="428.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="406.59999999999997" data-bottom="498.99999999999994"><tspan x="48" dy="0">Join a defined entity or</tspan><tspan x="48" dy="30.799999999999997">session across ordered</tspan><tspan x="48" dy="30.799999999999997">events.</tspan></text><rect x="410" y="345.79999999999995" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="385.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="363.79999999999995" data-bottom="394.59999999999997"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="428.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="406.59999999999997" data-bottom="498.99999999999994"><tspan x="428" dy="0">Declare permitted gaps,</tspan><tspan x="428" dy="30.799999999999997">missing steps and late</tspan><tspan x="428" dy="30.799999999999997">arrival.</tspan></text><rect x="30" y="537" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="577" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="555" data-bottom="616.6"><tspan x="47" dy="0">This illustrative workflow can also be legitimate; timing</tspan><tspan x="47" dy="30.799999999999997">alone is not causality.</tspan></text><text x="30" y="676.6" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="660.6" data-bottom="683"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

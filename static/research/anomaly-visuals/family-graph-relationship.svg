<svg xmlns="http://www.w3.org/2000/svg" width="800" height="849" viewBox="0 0 800 849" role="img" aria-labelledby="title desc"><title id="title">A new edge is a question</title><desc id="desc">Graph / Relationship: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Define the direction and meaning of each edge. Compare: Compare with a past-only relationship graph. Projects and migrations create legitimate edges; novelty is not attribution.</desc><rect width="800" height="849" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">A new edge is a question</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Graph / Relationship</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="740" height="245" rx="12" fill="#14233b" stroke="none"/><path d="M88 303.2 L712 268.2" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M705 263.2 L712 268.2 L705 273.2" stroke="#8cbcff" stroke-width="2" fill="none"/><path d="M88 303.2 L712 358.2" stroke="#8cbcff" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><path d="M705 353.2 L712 358.2 L705 363.2" stroke="#8cbcff" stroke-width="2" fill="none"/><circle cx="75" cy="303.2" r="12" fill="#8cbcff" st
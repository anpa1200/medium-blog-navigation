<svg xmlns="http://www.w3.org/2000/svg" width="400" height="898" viewBox="0 0 400 898" role="img" aria-labelledby="title desc"><title id="title">Storm-0558: customer-side detection did work</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: An acquired signing key was used to forge tokens. The CSRB describes State Department discovery using Big Yellow Taxi and MailItemsAccessed. Detection hypothesis: Use workload audit data and identity context; evaluate any proposed local analytic separately. The private rule and performance denominator are not published here. Storm-1283 OAuth cryptomining is a separate campaign.</desc><rect width="400" height="898" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Storm-0558:</tspan><tspan x="22" dy="42">customer-side</tspan><tspan x="22" dy="42">detection did work</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="241.2" width="356" height="199.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="277.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="259.2" data-bottom="284.4"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="314.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="296.4" data-bottom="422.4"><tspan x="40" dy="0">An acquired signing key was used</tspan><tspan x="40" dy="25.2">to forge tokens. The CSRB</tspan><tspan x="40" dy="25.2">describes State Department</tspan><tspan x="40" dy="25.2">discovery using Big Yellow Taxi</tspan><tspan x="40" dy="25.2">and MailItemsAccessed.</tspan></text><rect x="22" y="456.4" width="356" height="174" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="492.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="474.4" data-bottom="499.59999999999997"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="529.5999999999999" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="511.59999999999997" data-bottom="612.4"><tspan x="40" dy="0">Use workload audit data and</tspan><tspan x="40" dy="25.2">identity context; evaluate any</tspan><tspan x="40" dy="25.2">proposed local analytic</tspan><tspan x="40" dy="25.2">separately.</tspan></text><rect x="22" y="646.4" width="356" height="166" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="682.4" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="664.4" data-bottom="790.4"><tspan x="39" dy="0">The private rule and</tspan><tspan x="39" dy="25.2">performance denominator are not</tspan><tspan x="39" dy="25.2">published here. Storm-1283</tspan><tspan x="39" dy="25.2">OAuth cryptomining is a separate</tspan><tspan x="39" dy="25.2">campaign.</tspan></text><text x="22" y="848.4" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="834.4" data-bottom="873.6"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

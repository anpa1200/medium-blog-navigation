<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1237" viewBox="0 0 400 1237" role="img" aria-labelledby="title desc"><title id="title">Kerberoasting: request evidence versus outcome</title><desc id="desc">The statistic is distinct-service breadth, not proof that a ticket was cracked. The displayed blind spot is retained from the existing replay report. 4769 on the DC: Requester, service, result, encryption type. Breadth / novelty: Compare service requests in context. Investigation: Ticket requests do not prove offline recovery. Encryption scope: RC4 is 0x17; AES types include 0x11 and 0x12. RC4-only filters miss AES activity. Known blind spot: The public one-record replay produces no match for the service-breadth rule. No blanket exclusion for every account or service whose name ends in $.</desc><rect width="400" height="1237" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Kerberoasting:</tspan><tspan x="22" dy="42">request evidence</tspan><tspan x="22" dy="42">versus outcome</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="241.2" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="274.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="256.2" data-bottom="281.4"><tspan x="37" dy="0">4769 on the DC</tspan></text><text x="37" y="311.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="293.4" data-bottom="343.79999999999995"><tspan x="37" dy="0">Requester, service, result,</tspan><tspan x="37" dy="25.2">encryption type.</tspan></text><path d="M200 362.79999999999995 L200 398.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 391.79999999999995 L200 398.79999999999995 L205 391.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="402.79999999999995" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="435.79999999999995" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="417.79999999999995" data-bottom="442.99999999999994"><tspan x="37" dy="0">Breadth / novelty</tspan></text><text x="37" y="472.99999999999994" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="454.99999999999994" data-bottom="505.3999999999999"><tspan x="37" dy="0">Compare service requests in</tspan><tspan x="37" dy="25.2">context.</tspan></text><path d="M200 524.4 L200 560.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 553.4 L200 560.4 L205 553.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="564.4" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="597.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="579.4" data-bottom="604.6"><tspan x="37" dy="0">Investigation</tspan></text><text x="37" y="634.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="616.6" data-bottom="667"><tspan x="37" dy="0">Ticket requests do not prove</tspan><tspan x="37" dy="25.2">offline recovery.</tspan></text><rect x="22" y="706" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="742" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="724" data-bottom="749.2"><tspan x="40" dy="0">Encryption scope</tspan></text><text x="40" y="779.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="761.2" data-bottom="836.8000000000001"><tspan x="40" dy="0">RC4 is 0x17; AES types include</tspan><tspan x="40" dy="25.2">0x11 and 0x12. RC4-only</tspan><tspan x="40" dy="25.2">filters miss AES activity.</tspan></text><rect x="22" y="870.8" width="356" height="148.8" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="906.8" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="888.8" data-bottom="914"><tspan x="40" dy="0">Known blind spot</tspan></text><text x="40" y="944" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="926" data-bottom="1001.6"><tspan x="40" dy="0">The public one-record replay</tspan><tspan x="40" dy="25.2">produces no match for the</tspan><tspan x="40" dy="25.2">service-breadth rule.</tspan></text><rect x="22" y="1035.6" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1071.6" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1053.6" data-bottom="1129.1999999999998"><tspan x="39" dy="0">No blanket exclusion for every</tspan><tspan x="39" dy="25.2">account or service whose name</tspan><tspan x="39" dy="25.2">ends in $.</tspan></text><text x="22" y="1187.1999999999998" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1173.1999999999998" data-bottom="1212.3999999999999"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

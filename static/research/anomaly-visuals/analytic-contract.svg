<svg xmlns="http://www.w3.org/2000/svg" width="800" height="683" viewBox="0 0 800 683" role="img" aria-labelledby="title desc"><title id="title">Make the analytic reproducible</title><desc id="desc">Passing syntax and functional fixtures is one stage. Native ingestion, field compatibility and production value remain separate validation tasks. Define: Entity, units, windows and missing-data behavior. Implement: One maintained query + versioned adapters. Test: Positive, benign and failure cases. Evaluate: Held-out alerts, misses and workload. Eight normalized KQL examples are not eight drop-in native Sentinel connectors.</desc><rect width="800" height="683" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Make the analytic reproducible</tspan></text><text x="30" y="146.6" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="129.6" data-bottom="153.39999999999998"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="175.39999999999998" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="212.39999999999998" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="190.39999999999998" data-bottom="221.2"><tspan x="45" dy="0">Define</tspan></text><text x="45" y="255.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="233.2" data-bottom="294.79999999999995"><tspan x="45" dy="0">Entity, units, windows and</tspan><tspan x="45" dy="30.799999999999997">missing-data behavior.</tspan></text><path d="M390 242.59999999999997 L410 242.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 237.59999999999997 L410 242.59999999999997 L403 247.59999999999997" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="175.39999999999998" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="212.39999999999998" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="190.39999999999998" data-bottom="221.2"><tspan x="429" dy="0">Implement</tspan></text><text x="429" y="255.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="233.2" data-bottom="294.79999999999995"><tspan x="429" dy="0">One maintained query +</tspan><tspan x="429" dy="30.799999999999997">versioned adapters.</tspan></text><path d="M592 313.79999999999995 L592 331.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M592 331.79999999999995 L208 331.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M208 331.79999999999995 L208 349.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M203 342.79999999999995 L208 349.79999999999995 L213 342.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="30" y="353.79999999999995" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="390.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="368.79999999999995" data-bottom="399.59999999999997"><tspan x="45" dy="0">Test</tspan></text><text x="45" y="433.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="411.59999999999997" data-bottom="473.19999999999993"><tspan x="45" dy="0">Positive, benign and failure</tspan><tspan x="45" dy="30.799999999999997">cases.</tspan></text><path d="M390 420.99999999999994 L410 420.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 415.99999999999994 L410 420.99999999999994 L403 425.99999999999994" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="353.79999999999995" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="390.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="368.79999999999995" data-bottom="399.59999999999997"><tspan x="429" dy="0">Evaluate</tspan></text><text x="429" y="433.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="411.59999999999997" data-bottom="473.19999999999993"><tspan x="429" dy="0">Held-out alerts, misses and</tspan><tspan x="429" dy="30.799999999999997">workload.</tspan></text><rect x="30" y="512.1999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="552.1999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="530.1999999999999" data-bottom="591.8"><tspan x="47" dy="0">Eight normalized KQL examples are not eight drop-in native</tspan><tspan x="47" dy="30.799999999999997">Sentinel connectors.</tspan></text><text x="30" y="651.8" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="635.8" data-bottom="658.1999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

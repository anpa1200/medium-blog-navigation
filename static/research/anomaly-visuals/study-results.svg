<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1542" viewBox="0 0 800 1542" role="img" aria-labelledby="title desc"><title id="title">Corroboration reduces alerts and recall</title><desc id="desc">Confusion counts and precision/recall are computed from the committed study. Compared with ungated entity-MAD, the gate removes both false and true alerts; it is not a free improvement. The generator makes corroboration more likely for attacks. That advantage is assumed, not discovered.</desc><rect width="800" height="1542" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">Corroboration reduces alerts and</tspan><tspan x="30" dy="53.199999999999996">recall</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">SYNTHETIC RESULTS · NOT PRODUCTION</tspan></text><text x="30" y="250.59999999999997" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="228.59999999999997" data-bottom="259.4"><tspan x="30" dy="0">All bars use the same 0–100% scale.</tspan></text><text x="30" y="299.4" fill="#f3f7ff" font-size="24" font-weight="700" data-max-width="740" data-top="275.4" data-bottom="309"><tspan x="30" dy="0">global-z</tspan></text><text x="30" y="339" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="317" data-bottom="347.8"><tspan x="30" dy="0">Precision · 40%</tspan></text><rect x="30" y="355.8" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="355.8" width="296" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="30" y="411.8" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="389.8" data-bottom="420.6"><tspan x="30" dy="0">Recall · 30.8%</tspan></text><rect x="30" y="428.6" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="428.6" width="227.92" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="30" y="484.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="462.6" data-bottom="493.40000000000003"><tspan x="30" dy="0">TP 8 · FP 12 · FN 18 · TN 634</tspan></text><text x="30" y="533.4000000000001" fill="#f3f7ff" font-size="24" font-weight="700" data-max-width="740" data-top="509.40000000000003" data-bottom="543"><tspan x="30" dy="0">entity-z</tspan></text><text x="30" y="573" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="551" data-bottom="581.8"><tspan x="30" dy="0">Precision · 23.7%</tspan></text><rect x="30" y="589.8" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="589.8" width="175.38" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="30" y="645.8" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="623.8" data-bottom="654.5999999999999"><tspan x="30" dy="0">Recall · 53.8%</tspan></text><rect x="30" y="662.5999999999999" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="662.5999999999999" width="398.12" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="30" y="718.5999999999999" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="696.5999999999999" data-bottom="727.3999999999999"><tspan x="30" dy="0">TP 14 · FP 45 · FN 12 · TN 601</tspan></text><text x="30" y="767.3999999999999" fill="#f3f7ff" font-size="24" font-weight="700" data-max-width="740" data-top="743.3999999999999" data-bottom="776.9999999999999"><tspan x="30" dy="0">entity-mad</tspan></text><text x="30" y="806.9999999999999" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="784.9999999999999" data-bottom="815.7999999999998"><tspan x="30" dy="0">Precision · 17.5%</tspan></text><rect x="30" y="823.7999999999998" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="823.7999999999998" width="129.5" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="30" y="879.7999999999998" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="857.7999999999998" data-bottom="888.5999999999998"><tspan x="30" dy="0">Recall · 69.2%</tspan></text><rect x="30" y="896.5999999999998" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="896.5999999999998" width="512.08" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="30" y="952.5999999999998" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="930.5999999999998" data-bottom="961.3999999999997"><tspan x="30" dy="0">TP 18 · FP 85 · FN 8 · TN 561</tspan></text><text x="30" y="1001.3999999999997" fill="#f3f7ff" font-size="24" font-weight="700" data-max-width="740" data-top="977.3999999999997" data-bottom="1010.9999999999998"><tspan x="30" dy="0">entity-mad-gated</tspan></text><text x="30" y="1040.9999999999998" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="1018.9999999999998" data-bottom="1049.7999999999997"><tspan x="30" dy="0">Precision · 57.9%</tspan></text><rect x="30" y="1057.7999999999997" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="1057.7999999999997" width="428.46" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="30" y="1113.7999999999997" fill="#f3f7ff" font-size="22" font-weight="600" data-max-width="740" data-top="1091.7999999999997" data-bottom="1122.5999999999997"><tspan x="30" dy="0">Recall · 42.3%</tspan></text><rect x="30" y="1130.5999999999997" width="740" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="30" y="1130.5999999999997" width="313.02" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="30" y="1186.5999999999997" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="1164.5999999999997" data-bottom="1195.3999999999996"><tspan x="30" dy="0">TP 11 · FP 8 · FN 15 · TN 638</tspan></text><rect x="30" y="1211.3999999999996" width="740" height="140.39999999999998" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="48" y="1251.3999999999996" fill="#ffcd7a" font-size="22" font-weight="700" data-max-width="704" data-top="1229.3999999999996" data-bottom="1260.1999999999996"><tspan x="48" dy="0">Gate trade-off versus entity-MAD</tspan></text><text x="48" y="1294.1999999999996" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="1272.1999999999996" data-bottom="1333.7999999999995"><tspan x="48" dy="0">77 fewer false alerts, but 7 fewer true alerts. Recall</tspan><tspan x="48" dy="30.799999999999997">69.2% → 42.3%.</tspan></text><rect x="30" y="1371.7999999999997" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="1411.7999999999997" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="1389.7999999999997" data-bottom="1451.3999999999996"><tspan x="47" dy="0">The generator makes corroboration more likely for attacks.</tspan><tspan x="47" dy="30.799999999999997">That advantage is assumed, not discovered.</tspan></text><text x="30" y="1511.3999999999996" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="1495.3999999999996" data-bottom="1517.7999999999997"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

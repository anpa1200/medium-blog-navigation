<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1256" viewBox="0 0 400 1256" role="img" aria-labelledby="title desc"><title id="title">A field name is not a collection guarantee</title><desc id="desc">A telemetry contract connects source meaning to query assumptions. This diagram does not imply that a SIEM enables collection automatically. Source: Provider, channel, event version. Collection: Policy, filters, delivery health. Normalization: Parser, units, keys, clock. Analytic: Tested fields and explicit gaps. Distinct pipelines: Security 4688 and Sysmon 1 are separate process-creation sources. Validate each adapter. Missing observations: No event can mean no activity, disabled auditing, filtering, delay or failed collection. Validate raw records before treating a normalized table as detection coverage.</desc><rect width="400" height="1256" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">A field name is not a</tspan><tspan x="22" dy="42">collection guarantee</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="199.2" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="232.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="214.2" data-bottom="239.39999999999998"><tspan x="37" dy="0">Source</tspan></text><text x="37" y="269.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="251.39999999999998" data-bottom="276.59999999999997"><tspan x="37" dy="0">Provider, channel, event version.</tspan></text><path d="M200 295.6 L200 331.6" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 324.6 L200 331.6 L205 324.6" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="335.6" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="368.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="350.6" data-bottom="375.8"><tspan x="37" dy="0">Collection</tspan></text><text x="37" y="405.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="387.8" data-bottom="413"><tspan x="37" dy="0">Policy, filters, delivery health.</tspan></text><path d="M200 432 L200 468" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 461 L200 468 L205 461" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="472" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="505" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="487" data-bottom="512.2"><tspan x="37" dy="0">Normalization</tspan></text><text x="37" y="542.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="524.2" data-bottom="549.4000000000001"><tspan x="37" dy="0">Parser, units, keys, clock.</tspan></text><path d="M200 568.4 L200 604.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 597.4 L200 604.4 L205 597.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="608.4000000000001" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="641.4000000000001" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="623.4000000000001" data-bottom="648.6000000000001"><tspan x="37" dy="0">Analytic</tspan></text><text x="37" y="678.6000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="660.6000000000001" data-bottom="685.8000000000002"><tspan x="37" dy="0">Tested fields and explicit gaps.</tspan></text><rect x="22" y="724.8" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="760.8" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="742.8" data-bottom="768"><tspan x="40" dy="0">Distinct pipelines</tspan></text><text x="40" y="798" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="780" data-bottom="855.6"><tspan x="40" dy="0">Security 4688 and Sysmon 1 are</tspan><tspan x="40" dy="25.2">separate process-creation</tspan><tspan x="40" dy="25.2">sources. Validate each adapter.</tspan></text><rect x="22" y="889.5999999999999" width="356" height="148.8" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="925.5999999999999" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="907.5999999999999" data-bottom="932.8"><tspan x="40" dy="0">Missing observations</tspan></text><text x="40" y="962.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="944.8" data-bottom="1020.4"><tspan x="40" dy="0">No event can mean no activity,</tspan><tspan x="40" dy="25.2">disabled auditing, filtering, delay</tspan><tspan x="40" dy="25.2">or failed collection.</tspan></text><rect x="22" y="1054.3999999999999" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1090.3999999999999" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1072.3999999999999" data-bottom="1147.9999999999998"><tspan x="39" dy="0">Validate raw records before</tspan><tspan x="39" dy="25.2">treating a normalized table as</tspan><tspan x="39" dy="25.2">detection coverage.</tspan></text><text x="22" y="1205.9999999999998" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1191.9999999999998" data-bottom="1231.1999999999998"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg
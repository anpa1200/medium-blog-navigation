<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1027" viewBox="0 0 400 1027" role="img" aria-labelledby="title desc"><title id="title">Make the analytic reproducible</title><desc id="desc">Passing syntax and functional fixtures is one stage. Native ingestion, field compatibility and production value remain separate validation tasks. Define: Entity, units, windows and missing-data behavior. Implement: One maintained query + versioned adapters. Test: Positive, benign and failure cases. Evaluate: Held-out alerts, misses and workload. Eight normalized KQL examples are not eight drop-in native Sentinel connectors.</desc><rect width="400" height="1027" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Make the analytic</tspan><tspan x="22" dy="42">reproducible</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="199.2" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="232.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="214.2" data-bottom="239.39999999999998"><tspan x="37" dy="0">Define</tspan></text><text x="37" y="269.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="251.39999999999998" data-bottom="301.79999999999995"><tspan x="37" dy="0">Entity, units, windows and</tspan><tspan x="37" dy="25.2">missing-data behavior.</tspan></text><path d="M200 320.79999999999995 L200 356.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 349.79999999999995 L200 356.79999999999995 L205 349.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="360.79999999999995" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="393.79999999999995" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="375.79999999999995" data-bottom="400.99999999999994"><tspan x="37" dy="0">Implement</tspan></text><text x="37" y="430.99999999999994" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="412.99999999999994" data-bottom="463.3999999999999"><tspan x="37" dy="0">One maintained query + versioned</tspan><tspan x="37" dy="25.2">adapters.</tspan></text><path d="M200 482.4 L200 518.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 511.4 L200 518.4 L205 511.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="522.4" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="555.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="537.4" data-bottom="562.6"><tspan x="37" dy="0">Test</tspan></text><text x="37" y="592.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="574.6" data-bottom="625"><tspan x="37" dy="0">Positive, benign and failure</tspan><tspan x="37" dy="25.2">cases.</tspan></text><path d="M200 644 L200 680" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 673 L200 680 L205 673" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="684" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="717" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="699" data-bottom="724.2"><tspan x="37" dy="0">Evaluate</tspan></text><text x="37" y="754.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="736.2" data-bottom="786.6"><tspan x="37" dy="0">Held-out alerts, misses and</tspan><tspan x="37" dy="25.2">workload.</tspan></text><rect x="22" y="825.5999999999999" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="861.5999999999999" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="843.5999999999999" data-bottom="919.1999999999999"><tspan x="39" dy="0">Eight normalized KQL examples</tspan><tspan x="39" dy="25.2">are not eight drop-in native</tspan><tspan x="39" dy="25.2">Sentinel connectors.</tspan></text><text x="22" y="977.1999999999999" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="963.1999999999999" data-bottom="1002.4"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

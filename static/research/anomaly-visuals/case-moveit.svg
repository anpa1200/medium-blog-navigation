<svg xmlns="http://www.w3.org/2000/svg" width="800" height="720" viewBox="0 0 800 720" role="img" aria-labelledby="title desc"><title id="title">MOVEit: application account, not Windows user</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: LEMURLOOT interacted with the MOVEit database and created a MOVEit application account. Detection hypothesis: Correlate webshell access, application sessions, database changes and exports. Windows Security 4720 does not describe this SQL-backed application-account creation.</desc><rect width="800" height="720" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">MOVEit: application account, not</tspan><tspan x="30" dy="53.199999999999996">Windows user</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="30" y="228.59999999999997" width="740" height="140.39999999999998" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="48" y="268.59999999999997" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="704" data-top="246.59999999999997" data-bottom="277.4"><tspan x="48" dy="0">Source-reported</tspan></text><text x="48" y="311.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="289.4" data-bottom="351"><tspan x="48" dy="0">LEMURLOOT interacted with the MOVEit database and</tspan><tspan x="48" dy="30.799999999999997">created a MOVEit application account.</tspan></text><rect x="30" y="388.99999999999994" width="740" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="48" y="428.99999999999994" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="406.99999999999994" data-bottom="437.79999999999995"><tspan x="48" dy="0">Detection hypothesis</tspan></text><text x="48" y="471.79999999999995" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="449.79999999999995" data-bottom="511.4"><tspan x="48" dy="0">Correlate webshell access, application sessions, database</tspan><tspan x="48" dy="30.799999999999997">changes and exports.</tspan></text><rect x="30" y="549.3999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="589.3999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="567.3999999999999" data-bottom="628.9999999999999"><tspan x="47" dy="0">Windows Security 4720 does not describe this SQL-backed</tspan><tspan x="47" dy="30.799999999999997">application-account creation.</tspan></text><text x="30" y="688.9999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="672.9999999999999" data-bottom="695.3999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

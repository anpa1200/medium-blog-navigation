<svg xmlns="http://www.w3.org/2000/svg" width="800" height="866" viewBox="0 0 800 866" role="img" aria-labelledby="title desc"><title id="title">How much moved?</title><desc id="desc">Volumetric: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Count bytes, objects, rows or events; do not substitute one for another. Compare: Compare like workloads over equal observation windows. Backups, reporting and recovery can produce legitimate spikes.</desc><rect width="800" height="866" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">How much moved?</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Volumetric</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="740" height="200" rx="12" fill="#14233b" stroke="none"/><rect x="56" y="336.2" width="86.28571428571429" height="22" rx="12" fill="#8cbcff" stroke="none"/><rect x="154.28571428571428" y="329.2" width="86.28571428571429" height="28.999999999999996" rx="12" fill="#8cbcff" stroke="none"/><rect x="252.57142857142858" y="333.2" width="86.28571428571429" height="25" rx="12" fill="#8cbcff" stroke="none"/><rect x="350.8571428571429" y="327.2" width="86.28571428571429" height="31" rx="12" fill="#8cbcff" stroke="none"/><rect x="449.14285714285717" y="334.2" width="86.28571428571429" height="24" rx="12" fill="#8cbcff" stroke="none"/><rect x="547.4285714285714" y="273.2" width="86.28571428571429" height="85" rx="12" fill="#ffcd7a" stroke="none"/><rect x="645.7142857142858" y="328.2" width="86.28571428571429" height="30" rx="12" fill="#8cbcff" stroke="none"/><path d="M50 360.2 L750 360.2" stroke="#52708f" stroke-width="2.5" fill="none"/><text x="50" y="396.2" fill="#c4d2e8" font-size="20" font-weight="400" data-max-width="700" data-top="376.2" data-bottom="404.2"><tspan x="50" dy="0">Aligned observation windows →</tspan></text><text x="30" y="450.2" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="740" data-top="432.2" data-bottom="457.4"><tspan x="30" dy="0">Illustrative geometry only; no measured scale or operational threshold.</tspan></text><rect x="30" y="473.4" width="360" height="202" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="513.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="491.4" data-bottom="522.1999999999999"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="556.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="534.1999999999999" data-bottom="657.3999999999999"><tspan x="48" dy="0">Count bytes, objects, rows</tspan><tspan x="48" dy="30.799999999999997">or events; do not</tspan><tspan x="48" dy="30.799999999999997">substitute one for</tspan><tspan x="48" dy="30.799999999999997">another.</tspan></text><rect x="410" y="473.4" width="360" height="202" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="513.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="491.4" data-bottom="522.1999999999999"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="556.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="534.1999999999999" data-bottom="626.5999999999999"><tspan x="428" dy="0">Compare like workloads</tspan><tspan x="428" dy="30.799999999999997">over equal observation</tspan><tspan x="428" dy="30.799999999999997">windows.</tspan></text><rect x="30" y="695.4" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="735.4" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="713.4" data-bottom="775"><tspan x="47" dy="0">Backups, reporting and recovery can produce legitimate</tspan><tspan x="47" dy="30.799999999999997">spikes.</tspan></text><text x="30" y="835" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="819" data-bottom="841.4"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

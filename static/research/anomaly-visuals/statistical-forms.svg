<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1009" viewBox="0 0 800 1009" role="img" aria-labelledby="title desc"><title id="title">Three statistical forms</title><desc id="desc">Schematic examples of statistical forms. Dot positions and shapes are illustrations, not incident measurements. Point: One observation differs from a stated comparison distribution. Contextual: The same action differs in meaning across role, time or workload context. Collective: Related observations form an unusual pattern when considered together. Forms can overlap. None establishes malicious intent.</desc><rect width="800" height="1009" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Three statistical forms</tspan></text><text x="30" y="146.6" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="129.6" data-bottom="153.39999999999998"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="175.39999999999998" width="740" height="90" rx="12" fill="#14233b" stroke="none"/><text x="44" y="207.39999999999998" fill="#8cbcff" font-size="22" font-weight="600" data-max-width="712" data-top="185.39999999999998" data-bottom="216.2"><tspan x="44" dy="0">Point: unusual instance</tspan></text><circle cx="54" cy="239.39999999999998" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="169.33333333333331" cy="239.39999999999998" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="284.66666666666663" cy="239.39999999999998" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="400" cy="239.39999999999998" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="515.3333333333333" cy="239.39999999999998" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="630.6666666666666" cy="239.39999999999998" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="746" cy="239.39999999999998" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><rect x="30" y="279.4" width="740" height="90" rx="12" fill="#14233b" stroke="none"/><text x="44" y="311.4" fill="#8cbcff" font-size="22" font-weight="600" data-max-width="712" data-top="289.4" data-bottom="320.2"><tspan x="44" dy="0">Context: role / time</tspan></text><circle cx="54" cy="343.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="169.33333333333331" cy="343.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="284.66666666666663" cy="343.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="400" cy="343.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="515.3333333333333" cy="343.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="630.6666666666666" cy="343.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="746" cy="343.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><rect x="30" y="383.4" width="740" height="90" rx="12" fill="#14233b" stroke="none"/><text x="44" y="415.4" fill="#8cbcff" font-size="22" font-weight="600" data-max-width="712" data-top="393.4" data-bottom="424.2"><tspan x="44" dy="0">Collective: related pattern</tspan></text><circle cx="54" cy="447.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="169.33333333333331" cy="447.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="284.66666666666663" cy="447.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="400" cy="447.4" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="515.3333333333333" cy="447.4" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="630.6666666666666" cy="447.4" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="746" cy="447.4" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><rect x="30" y="487.4" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="527.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="505.4" data-bottom="536.1999999999999"><tspan x="48" dy="0">Point</tspan></text><text x="48" y="570.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="548.1999999999999" data-bottom="640.5999999999999"><tspan x="48" dy="0">One observation differs</tspan><tspan x="48" dy="30.799999999999997">from a stated comparison</tspan><tspan x="48" dy="30.799999999999997">distribution.</tspan></text><rect x="410" y="487.4" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="527.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="505.4" data-bottom="536.1999999999999"><tspan x="428" dy="0">Contextual</tspan></text><text x="428" y="570.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="548.1999999999999" data-bottom="640.5999999999999"><tspan x="428" dy="0">The same action differs in</tspan><tspan x="428" dy="30.799999999999997">meaning across role, time</tspan><tspan x="428" dy="30.799999999999997">or workload context.</tspan></text><rect x="30" y="678.5999999999999" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="718.5999999999999" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="696.5999999999999" data-bottom="727.3999999999999"><tspan x="48" dy="0">Collective</tspan></text><text x="48" y="761.3999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="739.3999999999999" data-bottom="831.7999999999998"><tspan x="48" dy="0">Related observations form</tspan><tspan x="48" dy="30.799999999999997">an unusual pattern when</tspan><tspan x="48" dy="30.799999999999997">considered together.</tspan></text><rect x="30" y="869.8" width="740" height="70.8" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="909.8" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="887.8" data-bottom="918.5999999999999"><tspan x="47" dy="0">Forms can overlap. None establishes malicious intent.</tspan></text><text x="30" y="978.5999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="962.5999999999999" data-bottom="984.9999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

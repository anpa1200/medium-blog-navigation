<svg xmlns="http://www.w3.org/2000/svg" width="800" height="978" viewBox="0 0 800 978" role="img" aria-labelledby="title desc"><title id="title">From anomaly to investigation</title><desc id="desc">A detection-engineering workflow, not a chronological attack lifecycle. Validation and analyst judgment are required before operational action. Observe: Collect an event or change. Compare: Use a defined baseline. Corroborate: Check entity and context. Investigate: Test competing explanations. Scope: 14 operational families + multi-event correlation. These are overlapping analytical views. Evidence boundary: Incident reports, functional tests and synthetic statistics answer different questions. An anomaly is a lead, not an intrusion verdict or actor attribution.</desc><rect width="800" height="978" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">From anomaly to investigation</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Malicious Activity as a Statistical Signal</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="218.2" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="233.2" data-bottom="264"><tspan x="45" dy="0">Observe</tspan></text><text x="45" y="298" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="276" data-bottom="306.8"><tspan x="45" dy="0">Collect an event or change.</tspan></text><path d="M390 285.4 L410 285.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 280.4 L410 285.4 L403 290.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="218.2" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="233.2" data-bottom="264"><tspan x="429" dy="0">Compare</tspan></text><text x="429" y="298" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="276" data-bottom="306.8"><tspan x="429" dy="0">Use a defined baseline.</tspan></text><path d="M592 356.59999999999997 L592 374.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M592 374.59999999999997 L208 374.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M208 374.59999999999997 L208 392.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M203 385.59999999999997 L208 392.59999999999997 L213 385.59999999999997" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="30" y="396.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="433.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="411.59999999999997" data-bottom="442.4"><tspan x="45" dy="0">Corroborate</tspan></text><text x="45" y="476.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="454.4" data-bottom="485.2"><tspan x="45" dy="0">Check entity and context.</tspan></text><path d="M390 463.79999999999995 L410 463.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 458.79999999999995 L410 463.79999999999995 L403 468.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="396.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="433.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="411.59999999999997" data-bottom="442.4"><tspan x="429" dy="0">Investigate</tspan></text><text x="429" y="476.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="454.4" data-bottom="516"><tspan x="429" dy="0">Test competing</tspan><tspan x="429" dy="30.799999999999997">explanations.</tspan></text><rect x="30" y="555" width="360" height="232.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="595" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="573" data-bottom="603.8"><tspan x="48" dy="0">Scope</tspan></text><text x="48" y="637.8" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="615.8" data-bottom="739"><tspan x="48" dy="0">14 operational families +</tspan><tspan x="48" dy="30.799999999999997">multi-event correlation.</tspan><tspan x="48" dy="30.799999999999997">These are overlapping</tspan><tspan x="48" dy="30.799999999999997">analytical views.</tspan></text><rect x="410" y="555" width="360" height="232.8" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="428" y="595" fill="#ffcd7a" font-size="22" font-weight="700" data-max-width="324" data-top="573" data-bottom="603.8"><tspan x="428" dy="0">Evidence boundary</tspan></text><text x="428" y="637.8" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="615.8" data-bottom="769.8"><tspan x="428" dy="0">Incident reports,</tspan><tspan x="428" dy="30.799999999999997">functional tests and</tspan><tspan x="428" dy="30.799999999999997">synthetic statistics</tspan><tspan x="428" dy="30.799999999999997">answer different</tspan><tspan x="428" dy="30.799999999999997">questions.</tspan></text><rect x="30" y="807.8" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="847.8" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="825.8" data-bottom="887.4"><tspan x="47" dy="0">An anomaly is a lead, not an intrusion verdict or actor</tspan><tspan x="47" dy="30.799999999999997">attribution.</tspan></text><text x="30" y="947.4" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="931.4" data-bottom="953.8"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="932" viewBox="0 0 400 932" role="img" aria-labelledby="title desc"><title id="title">High entropy is not proof of tunneling</title><desc id="desc">The values are computed from the displayed strings. The maintained query is an ASCII-label feature extractor; it is not a SUNBURST detector or a universal tunneling threshold. Definition: H = −Σ p(c) log₂ p(c), in bits per character. Count characters in the selected label. Bound: For length n and alphabet A: H ≤ log₂(min(n, |A|)). Label selection and case normalization matter. abcd is structured, yet has 2 bits/character. This feature does not measure intent.</desc><rect width="400" height="932" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">High entropy is not</tspan><tspan x="22" dy="42">proof of tunneling</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">EXACT MATH · SYNTHETIC LABELS</tspan></text><text x="22" y="217.2" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="199.2" data-bottom="224.39999999999998"><tspan x="22" dy="0">aaaa · 0 bits/character</tspan></text><rect x="22" y="232.39999999999998" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><text x="22" y="284.4" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="266.4" data-bottom="291.59999999999997"><tspan x="22" dy="0">abab · 1 bits/character</tspan></text><rect x="22" y="299.59999999999997" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="299.59999999999997" width="178" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="22" y="351.59999999999997" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="333.59999999999997" data-bottom="358.79999999999995"><tspan x="22" dy="0">abcd · 2 bits/character</tspan></text><rect x="22" y="366.79999999999995" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="366.79999999999995" width="356" height="16" rx="12" fill="#8cbcff" stroke="none"/><rect x="22" y="400.79999999999995" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="436.79999999999995" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="418.79999999999995" data-bottom="443.99999999999994"><tspan x="40" dy="0">Definition</tspan></text><text x="40" y="473.99999999999994" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="455.99999999999994" data-bottom="531.5999999999999"><tspan x="40" dy="0">H = −Σ p(c) log₂ p(c), in bits</tspan><tspan x="40" dy="25.2">per character. Count</tspan><tspan x="40" dy="25.2">characters in the selected label.</tspan></text><rect x="22" y="565.5999999999999" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="601.5999999999999" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="583.5999999999999" data-bottom="608.8"><tspan x="40" dy="0">Bound</tspan></text><text x="40" y="638.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="620.8" data-bottom="721.5999999999999"><tspan x="40" dy="0">For length n and alphabet A: H ≤</tspan><tspan x="40" dy="25.2">log₂(min(n, |A|)). Label</tspan><tspan x="40" dy="25.2">selection and case normalization</tspan><tspan x="40" dy="25.2">matter.</tspan></text><rect x="22" y="730.3999999999999" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="766.3999999999999" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="748.3999999999999" data-bottom="823.9999999999999"><tspan x="39" dy="0">abcd is structured, yet has 2</tspan><tspan x="39" dy="25.2">bits/character. This feature</tspan><tspan x="39" dy="25.2">does not measure intent.</tspan></text><text x="22" y="881.9999999999999" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="867.9999999999999" data-bottom="907.1999999999999"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

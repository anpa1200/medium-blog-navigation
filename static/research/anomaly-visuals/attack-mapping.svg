<svg xmlns="http://www.w3.org/2000/svg" width="800" height="841" viewBox="0 0 800 841" role="img" aria-labelledby="title desc"><title id="title">Map behavior, then ask what is measurable</title><desc id="desc">The article’s tactic matrix is a set of proposed observation opportunities. It is not a ranking of detector performance. Observed behavior: Keep the source and its limits. ATT&amp;CK mapping: Explain why the behavior fits. Candidate feature: Name fields, units and context. ATT&amp;CK v19.2 context: The v19 split created Stealth and Defense Impairment. Tactics are not a required time sequence. Do not infer: An anomaly tag is neither a technique verdict, a group identity nor measured detection coverage. These are analytical relationships, not a guaranteed attack progression.</desc><rect width="800" height="841" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">Map behavior, then ask what is</tspan><tspan x="30" dy="53.199999999999996">measurable</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="228.59999999999997" width="228" height="196" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="305.19999999999993"><tspan x="45" dy="0">Observed</tspan><tspan x="45" dy="30.799999999999997">behavior</tspan></text><text x="45" y="339.19999999999993" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="317.19999999999993" data-bottom="378.79999999999995"><tspan x="45" dy="0">Keep the source</tspan><tspan x="45" dy="30.799999999999997">and its limits.</tspan></text><path d="M262 326.59999999999997 L282 326.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 321.59999999999997 L282 326.59999999999997 L275 331.59999999999997" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="228.59999999999997" width="228" height="196" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="274.4"><tspan x="301" dy="0">ATT&amp;CK mapping</tspan></text><text x="301" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="286.4" data-bottom="348"><tspan x="301" dy="0">Explain why the</tspan><tspan x="301" dy="30.799999999999997">behavior fits.</tspan></text><path d="M518 326.59999999999997 L538 326.59999999999997" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 321.59999999999997 L538 326.59999999999997 L531 331.59999999999997" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="228.59999999999997" width="228" height="196" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="243.59999999999997" data-bottom="305.19999999999993"><tspan x="557" dy="0">Candidate</tspan><tspan x="557" dy="30.799999999999997">feature</tspan></text><text x="557" y="339.19999999999993" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="198" data-top="317.19999999999993" data-bottom="409.5999999999999"><tspan x="557" dy="0">Name fields,</tspan><tspan x="557" dy="30.799999999999997">units and</tspan><tspan x="557" dy="30.799999999999997">context.</tspan></text><rect x="30" y="448.59999999999997" width="360" height="202" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="488.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="466.59999999999997" data-bottom="497.4"><tspan x="48" dy="0">ATT&amp;CK v19.2 context</tspan></text><text x="48" y="531.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="509.4" data-bottom="632.5999999999999"><tspan x="48" dy="0">The v19 split created</tspan><tspan x="48" dy="30.799999999999997">Stealth and Defense</tspan><tspan x="48" dy="30.799999999999997">Impairment. Tactics are not</tspan><tspan x="48" dy="30.799999999999997">a required time sequence.</tspan></text><rect x="410" y="448.59999999999997" width="360" height="202" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="428" y="488.59999999999997" fill="#ffcd7a" font-size="22" font-weight="700" data-max-width="324" data-top="466.59999999999997" data-bottom="497.4"><tspan x="428" dy="0">Do not infer</tspan></text><text x="428" y="531.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="509.4" data-bottom="632.5999999999999"><tspan x="428" dy="0">An anomaly tag is neither a</tspan><tspan x="428" dy="30.799999999999997">technique verdict, a group</tspan><tspan x="428" dy="30.799999999999997">identity nor measured</tspan><tspan x="428" dy="30.799999999999997">detection coverage.</tspan></text><rect x="30" y="670.5999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="710.5999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="688.5999999999999" data-bottom="750.1999999999999"><tspan x="47" dy="0">These are analytical relationships, not a guaranteed</tspan><tspan x="47" dy="30.799999999999997">attack progression.</tspan></text><text x="30" y="810.1999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="794.1999999999999" data-bottom="816.5999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

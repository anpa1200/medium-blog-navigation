<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1156" viewBox="0 0 400 1156" role="img" aria-labelledby="title desc"><title id="title">Three statistical forms</title><desc id="desc">Schematic examples of statistical forms. Dot positions and shapes are illustrations, not incident measurements. Point: One observation differs from a stated comparison distribution. Contextual: The same action differs in meaning across role, time or workload context. Collective: Related observations form an unusual pattern when considered together. Forms can overlap. None establishes malicious intent.</desc><rect width="400" height="1156" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Three statistical</tspan><tspan x="22" dy="42">forms</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="199.2" width="356" height="90" rx="12" fill="#14233b" stroke="none"/><text x="36" y="227.2" fill="#8cbcff" font-size="18" font-weight="600" data-max-width="328" data-top="209.2" data-bottom="234.39999999999998"><tspan x="36" dy="0">Point: unusual instance</tspan></text><circle cx="46" cy="263.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="97.33333333333334" cy="263.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="148.66666666666669" cy="263.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="200" cy="263.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="251.33333333333334" cy="263.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="302.6666666666667" cy="263.2" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="354" cy="263.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><rect x="22" y="303.2" width="356" height="90" rx="12" fill="#14233b" stroke="none"/><text x="36" y="331.2" fill="#8cbcff" font-size="18" font-weight="600" data-max-width="328" data-top="313.2" data-bottom="338.4"><tspan x="36" dy="0">Context: role / time</tspan></text><circle cx="46" cy="367.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="97.33333333333334" cy="367.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="148.66666666666669" cy="367.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="200" cy="367.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="251.33333333333334" cy="367.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="302.6666666666667" cy="367.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="354" cy="367.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><rect x="22" y="407.2" width="356" height="90" rx="12" fill="#14233b" stroke="none"/><text x="36" y="435.2" fill="#8cbcff" font-size="18" font-weight="600" data-max-width="328" data-top="417.2" data-bottom="442.4"><tspan x="36" dy="0">Collective: related pattern</tspan></text><circle cx="46" cy="471.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="97.33333333333334" cy="471.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="148.66666666666669" cy="471.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="200" cy="471.2" r="7" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="251.33333333333334" cy="471.2" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="302.6666666666667" cy="471.2" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><circle cx="354" cy="471.2" r="7" fill="#ffcd7a" stroke="none" stroke-width="2"/><rect x="22" y="511.2" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="547.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="529.2" data-bottom="554.4000000000001"><tspan x="40" dy="0">Point</tspan></text><text x="40" y="584.4000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="566.4000000000001" data-bottom="616.8000000000001"><tspan x="40" dy="0">One observation differs from a</tspan><tspan x="40" dy="25.2">stated comparison distribution.</tspan></text><rect x="22" y="650.8" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="686.8" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="668.8" data-bottom="694"><tspan x="40" dy="0">Contextual</tspan></text><text x="40" y="724" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="706" data-bottom="781.6"><tspan x="40" dy="0">The same action differs in</tspan><tspan x="40" dy="25.2">meaning across role, time or</tspan><tspan x="40" dy="25.2">workload context.</tspan></text><rect x="22" y="815.5999999999999" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="851.5999999999999" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="833.5999999999999" data-bottom="858.8"><tspan x="40" dy="0">Collective</tspan></text><text x="40" y="888.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="870.8" data-bottom="946.4"><tspan x="40" dy="0">Related observations form an</tspan><tspan x="40" dy="25.2">unusual pattern when considered</tspan><tspan x="40" dy="25.2">together.</tspan></text><rect x="22" y="980.3999999999999" width="356" height="90.4" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1016.3999999999999" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="998.3999999999999" data-bottom="1
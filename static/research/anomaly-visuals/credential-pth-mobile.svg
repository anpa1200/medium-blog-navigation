<svg xmlns="http://www.w3.org/2000/svg" width="400" height="822" viewBox="0 0 400 822" role="img" aria-labelledby="title desc"><title id="title">Pass-the-Hash: two hunting views, no single verdict</title><desc id="desc">Neither view proves PtH, and not every implementation produces both. Correlate account, source process, destination and authorized administration. Target-side view: 4624 type 3 with NTLM can describe ordinary network authentication. Source-side view: Type 9 NewCredentials with seclogo can appear in some implementations and legitimate alternate-credential workflows. The NTLM hash is not sent as the password. Context and implementation-specific evidence are required.</desc><rect width="400" height="822" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Pass-the-Hash: two</tspan><tspan x="22" dy="42">hunting views, no</tspan><tspan x="22" dy="42">single verdict</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">TELEMETRY MODEL · NOT CLASSIFICATION</tspan></text><rect x="22" y="241.2" width="356" height="148.8" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="277.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="259.2" data-bottom="284.4"><tspan x="40" dy="0">Target-side view</tspan></text><text x="40" y="314.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="296.4" data-bottom="372"><tspan x="40" dy="0">4624 type 3 with NTLM can</tspan><tspan x="40" dy="25.2">describe ordinary network</tspan><tspan x="40" dy="25.2">authentication.</tspan></text><rect x="22" y="406" width="356" height="174" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="442" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="424" data-bottom="449.2"><tspan x="40" dy="0">Source-side view</tspan></text><text x="40" y="479.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="461.2" data-bottom="562"><tspan x="40" dy="0">Type 9 NewCredentials with</tspan><tspan x="40" dy="25.2">seclogo can appear in some</tspan><tspan x="40" dy="25.2">implementations and legitimate</tspan><tspan x="40" dy="25.2">alternate-credential workflows.</tspan></text><rect x="22" y="596" width="356" height="140.8" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="632" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="614" data-bottom="714.8"><tspan x="39" dy="0">The NTLM hash is not sent as</tspan><tspan x="39" dy="25.2">the password. Context and</tspan><tspan x="39" dy="25.2">implementation-specific evidence</tspan><tspan x="39" dy="25.2">are required.</tspan></text><text x="22" y="772.8" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="758.8" data-bottom="798"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="643" viewBox="0 0 800 643" role="img" aria-labelledby="title desc"><title id="title">Rare events change alert precision</title><desc id="desc">Precision uses all alerts as its denominator; false-positive rate uses all benign events. A 1% false-positive rate does not mean 99% alert precision. These assumed counts explain base rates; they are not measured detector results.</desc><rect width="800" height="643" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Rare events change alert precision</tspan></text><text x="30" y="146.6" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="129.6" data-bottom="153.39999999999998"><tspan x="30" dy="0">ILLUSTRATIVE ARITHMETIC</tspan></text><rect x="30" y="175.39999999999998" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="48" y="215.39999999999998" fill="#ffcd7a" font-size="22" font-weight="700" data-max-width="324" data-top="193.39999999999998" data-bottom="224.2"><tspan x="48" dy="0">Benign events</tspan></text><text x="48" y="258.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="236.2" data-bottom="297.79999999999995"><tspan x="48" dy="0">1,000,000 × 1% FPR →</tspan><tspan x="48" dy="30.799999999999997">10,000 false alerts</tspan></text><rect x="410" y="175.39999999999998" width="360" height="140.39999999999998" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="428" y="215.39999999999998" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="324" data-top="193.39999999999998" data-bottom="224.2"><tspan x="428" dy="0">Malicious events</tspan></text><text x="428" y="258.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="236.2" data-bottom="297.79999999999995"><tspan x="428" dy="0">100 × 90% recall → 90</tspan><tspan x="428" dy="30.799999999999997">true alerts</tspan></text><text x="30" y="366.79999999999995" fill="#68e0cb" font-size="31" font-weight="400" data-max-width="740" data-top="335.79999999999995" data-bottom="379.19999999999993"><tspan x="30" dy="0">Precision = 90 / (90 + 10,000) = 0.89%</tspan></text><text x="30" y="417.19999999999993" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="395.19999999999993" data-bottom="456.79999999999995"><tspan x="30" dy="0">False-positive rate = FP / (FP + TN). Precision = TP / (TP +</tspan><tspan x="30" dy="30.799999999999997">FP).</tspan></text><rect x="30" y="472.79999999999995" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="512.8" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="490.79999999999995" data-bottom="552.4"><tspan x="47" dy="0">These assumed counts explain base rates; they are not</tspan><tspan x="47" dy="30.799999999999997">measured detector results.</tspan></text><text x="30" y="612.4" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="596.4" data-bottom="618.8"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

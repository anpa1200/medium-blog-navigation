<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1545" viewBox="0 0 400 1545" role="img" aria-labelledby="title desc"><title id="title">Corroboration reduces alerts and recall</title><desc id="desc">Confusion counts and precision/recall are computed from the committed study. Compared with ungated entity-MAD, the gate removes both false and true alerts; it is not a free improvement. The generator makes corroboration more likely for attacks. That advantage is assumed, not discovered.</desc><rect width="400" height="1545" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Corroboration</tspan><tspan x="22" dy="42">reduces alerts and</tspan><tspan x="22" dy="42">recall</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SYNTHETIC RESULTS · NOT PRODUCTION</tspan></text><text x="22" y="259.2" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="241.2" data-bottom="266.4"><tspan x="22" dy="0">All bars use the same 0–100% scale.</tspan></text><text x="22" y="302.4" fill="#f3f7ff" font-size="20" font-weight="700" data-max-width="356" data-top="282.4" data-bottom="310.4"><tspan x="22" dy="0">global-z</tspan></text><text x="22" y="336.4" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="318.4" data-bottom="343.59999999999997"><tspan x="22" dy="0">Precision · 40%</tspan></text><rect x="22" y="351.59999999999997" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="351.59999999999997" width="142.4" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="22" y="403.59999999999997" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="385.59999999999997" data-bottom="410.79999999999995"><tspan x="22" dy="0">Recall · 30.8%</tspan></text><rect x="22" y="418.79999999999995" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="418.79999999999995" width="109.64800000000001" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="22" y="470.79999999999995" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="452.79999999999995" data-bottom="477.99999999999994"><tspan x="22" dy="0">TP 8 · FP 12 · FN 18 · TN 634</tspan></text><text x="22" y="514" fill="#f3f7ff" font-size="20" font-weight="700" data-max-width="356" data-top="493.99999999999994" data-bottom="522"><tspan x="22" dy="0">entity-z</tspan></text><text x="22" y="548" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="530" data-bottom="555.2"><tspan x="22" dy="0">Precision · 23.7%</tspan></text><rect x="22" y="563.2" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="563.2" width="84.37199999999999" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="22" y="615.2" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="597.2" data-bottom="622.4000000000001"><tspan x="22" dy="0">Recall · 53.8%</tspan></text><rect x="22" y="630.4000000000001" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="630.4000000000001" width="191.528" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="22" y="682.4000000000001" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="664.4000000000001" data-bottom="689.6000000000001"><tspan x="22" dy="0">TP 14 · FP 45 · FN 12 · TN 601</tspan></text><text x="22" y="725.6000000000001" fill="#f3f7ff" font-size="20" font-weight="700" data-max-width="356" data-top="705.6000000000001" data-bottom="733.6000000000001"><tspan x="22" dy="0">entity-mad</tspan></text><text x="22" y="759.6000000000001" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="741.6000000000001" data-bottom="766.8000000000002"><tspan x="22" dy="0">Precision · 17.5%</tspan></text><rect x="22" y="774.8000000000002" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="774.8000000000002" width="62.3" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="22" y="826.8000000000002" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="808.8000000000002" data-bottom="834.0000000000002"><tspan x="22" dy="0">Recall · 69.2%</tspan></text><rect x="22" y="842.0000000000002" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="842.0000000000002" width="246.352" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="22" y="894.0000000000002" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="876.0000000000002" data-bottom="901.2000000000003"><tspan x="22" dy="0">TP 18 · FP 85 · FN 8 · TN 561</tspan></text><text x="22" y="937.2000000000003" fill="#f3f7ff" font-size="20" font-weight="700" data-max-width="356" data-top="917.2000000000003" data-bottom="945.2000000000003"><tspan x="22" dy="0">entity-mad-gated</tspan></text><text x="22" y="971.2000000000003" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="953.2000000000003" data-bottom="978.4000000000003"><tspan x="22" dy="0">Precision · 57.9%</tspan></text><rect x="22" y="986.4000000000003" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="986.4000000000003" width="206.12399999999997" height="16" rx="12" fill="#68e0cb" stroke="none"/><text x="22" y="1038.4000000000003" fill="#f3f7ff" font-size="18" font-weight="600" data-max-width="356" data-top="1020.4000000000003" data-bottom="1045.6000000000004"><tspan x="22" dy="0">Recall · 42.3%</tspan></text><rect x="22" y="1053.6000000000004" width="356" height="16" rx="12" fill="#14233b" stroke="none"/><rect x="22" y="1053.6000000000004" width="150.588" height="16" rx="12" fill="#8cbcff" stroke="none"/><text x="22" y="1105.6000000000004" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="1087.6000000000004" data-bottom="1112.8000000000004"><tspan x="22" dy="0">TP 11 · FP 8 · FN 15 · TN 638</tspan></text><rect x="22" y="1128.8000000000004" width="356" height="174" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="1164.8000000000004" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="1146.8000000000004" data-bottom="1197.2000000000005"><tspan x="40" dy="0">Gate trade-off versus</tspan><tspan x="40" dy="25.2">entity-MAD</tspan></text><text x="40" y="1227.2000000000005" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="1209.2000000000005" data-bottom="1284.8000000000004"><tspan x="40" dy="0">77 fewer false alerts, but 7</tspan><tspan x="40" dy="25.2">fewer true alerts. Recall 69.2%</tspan><tspan x="40" dy="25.2">→ 42.3%.</tspan></text><rect x="22" y="1318.8000000000004" width="356" height="140.8" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1354.8000000000004" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1336.8000000000004" data-bottom="1437.6000000000004"><tspan x="39" dy="0">The generator makes</tspan><tspan x="39" dy="25.2">corroboration more likely for</tspan><tspan x="39" dy="25.2">attacks. That advantage is</tspan><tspan x="39" dy="25.2">assumed, not discovered.</tspan></text><text x="22" y="1495.6000000000004" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1481.6000000000004" data-bottom="1520.8000000000004"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

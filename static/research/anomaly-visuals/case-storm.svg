<svg xmlns="http://www.w3.org/2000/svg" width="800" height="781" viewBox="0 0 800 781" role="img" aria-labelledby="title desc"><title id="title">Storm-0558: customer-side detection did work</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: An acquired signing key was used to forge tokens. The CSRB describes State Department discovery using Big Yellow Taxi and MailItemsAccessed. Detection hypothesis: Use workload audit data and identity context; evaluate any proposed local analytic separately. The private rule and performance denominator are not published here. Storm-1283 OAuth cryptomining is a separate campaign.</desc><rect width="800" height="781" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">Storm-0558: customer-side</tspan><tspan x="30" dy="53.199999999999996">detection did work</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="30" y="228.59999999999997" width="740" height="171.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="48" y="268.59999999999997" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="704" data-top="246.59999999999997" data-bottom="277.4"><tspan x="48" dy="0">Source-reported</tspan></text><text x="48" y="311.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="289.4" data-bottom="381.79999999999995"><tspan x="48" dy="0">An acquired signing key was used to forge tokens. The</tspan><tspan x="48" dy="30.799999999999997">CSRB describes State Department discovery using Big</tspan><tspan x="48" dy="30.799999999999997">Yellow Taxi and MailItemsAccessed.</tspan></text><rect x="30" y="419.79999999999995" width="740" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="48" y="459.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="437.79999999999995" data-bottom="468.59999999999997"><tspan x="48" dy="0">Detection hypothesis</tspan></text><text x="48" y="502.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="480.59999999999997" data-bottom="542.1999999999999"><tspan x="48" dy="0">Use workload audit data and identity context; evaluate any</tspan><tspan x="48" dy="30.799999999999997">proposed local analytic separately.</tspan></text><rect x="30" y="580.1999999999999" width="740" height="132.39999999999998" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="620.1999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="598.1999999999999" data-bottom="690.5999999999999"><tspan x="47" dy="0">The private rule and performance denominator are not</tspan><tspan x="47" dy="30.799999999999997">published here. Storm-1283 OAuth cryptomining is a</tspan><tspan x="47" dy="30.799999999999997">separate campaign.</tspan></text><text x="30" y="750.5999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="734.5999999999999" data-bottom="756.9999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

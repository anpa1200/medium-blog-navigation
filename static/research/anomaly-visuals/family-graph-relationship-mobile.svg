<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1034" viewBox="0 0 400 1034" role="img" aria-labelledby="title desc"><title id="title">A new edge is a question</title><desc id="desc">Graph / Relationship: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Define the direction and meaning of each edge. Compare: Compare with a past-only relationship graph. Projects and migrations create legitimate edges; novelty is not attribution.</desc><rect width="400" height="1034" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">A new edge is a</tspan><tspan x="22" dy="42">question</tspan></text><text x="22" y="175.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="157.6" data-bottom="182.79999999999998"><tspan x="22" dy="0">Graph / Relationship</tspan></text><text x="22" y="208.8" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="194.8" data-bottom="214.4"><tspan x="22" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="22" y="236.4" width="356" height="245" rx="12" fill="#14233b" stroke="none"/><path d="M80 321.4 L320 286.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M313 281.4 L320 286.4 L313 291.4" stroke="#8cbcff" stroke-width="2" fill="none"/><path d="M80 321.4 L320 376.4" stroke="#8cbcff" stroke-width="2.5" fill="none" stroke-dasharray="6 5"/><path d="M313 371.4 L320 376.4 L313 381.4" stroke="#8cbcff" stroke-width="2" fill="none"/><circle cx="67" cy="321.4" r="12" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="333" cy="286.4" r="12" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="333" cy="376.4" r="12" fill="#ffcd7a" stroke="none" stroke-width="2"/><text x="42" y="424.4" fill="#8cbcff" font-size="18" font-weight="400" data-max-width="316" data-top="406.4" data-bottom="431.59999999999997"><tspan x="42" dy="0">Observed relationship</tspan></text><text x="42" y="456.4" fill="#ffcd7a" font-size="16" font-weight="400" data-max-width="316" data-top="440.4" data-bottom="462.79999999999995"><tspan x="42" dy="0">Dashed: new relationship to review</tspan></text><text x="22" y="510.4" fill="#c4d2e8" font-size="15" font-weight="400" data-max-width="356" data-top="495.4" data-bottom="537.4"><tspan x="22" dy="0">Illustrative geometry only; no measured</tspan><tspan x="22" dy="21">scale or operational threshold.</tspan></text><rect x="22" y="553.4" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="589.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="571.4" data-bottom="596.6"><tspan x="40" dy="0">Measure</tspan></text><text x="40" y="626.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="608.6" data-bottom="659"><tspan x="40" dy="0">Define the direction and meaning</tspan><tspan x="40" dy="25.2">of each edge.</tspan></text><rect x="22" y="693" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="729" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="711" data-bottom="736.2"><tspan x="40" dy="0">Compare</tspan></text><text x="40" y="766.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="748.2" data-bottom="798.6"><tspan x="40" dy="0">Compare with a past-only</tspan><tspan x="40" dy="25.2">relationship graph.</tspan></text><rect x="22" y="832.6" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="868.6" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="850.6" data-bottom="926.2"><tspan x="39" dy="0">Projects and migrations create</tspan><tspan x="39" dy="25.2">legitimate edges; novelty is not</tspan><tspan x="39" dy="25.2">attribution.</tspan></text><text x="22" y="984.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="970.2" data-bottom="1009.4000000000001"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="751" viewBox="0 0 800 751" role="img" aria-labelledby="title desc"><title id="title">UNC3944: look across identity and SaaS</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: Mandiant described help-desk social engineering, identity abuse and SaaS data theft using legitimate integration tools. Detection hypothesis: Join factor changes to sessions and sensitive application actions with real tenant/account keys. A transfer can bypass endpoint sensors without leaving every provider or application blind.</desc><rect width="800" height="751" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">UNC3944: look across identity and</tspan><tspan x="30" dy="53.199999999999996">SaaS</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="30" y="228.59999999999997" width="740" height="171.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="48" y="268.59999999999997" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="704" data-top="246.59999999999997" data-bottom="277.4"><tspan x="48" dy="0">Source-reported</tspan></text><text x="48" y="311.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="289.4" data-bottom="381.79999999999995"><tspan x="48" dy="0">Mandiant described help-desk social engineering, identity</tspan><tspan x="48" dy="30.799999999999997">abuse and SaaS data theft using legitimate integration</tspan><tspan x="48" dy="30.799999999999997">tools.</tspan></text><rect x="30" y="419.79999999999995" width="740" height="140.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="48" y="459.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="437.79999999999995" data-bottom="468.59999999999997"><tspan x="48" dy="0">Detection hypothesis</tspan></text><text x="48" y="502.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="480.59999999999997" data-bottom="542.1999999999999"><tspan x="48" dy="0">Join factor changes to sessions and sensitive application</tspan><tspan x="48" dy="30.799999999999997">actions with real tenant/account keys.</tspan></text><rect x="30" y="580.1999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="620.1999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="598.1999999999999" data-bottom="659.8"><tspan x="47" dy="0">A transfer can bypass endpoint sensors without leaving</tspan><tspan x="47" dy="30.799999999999997">every provider or application blind.</tspan></text><text x="30" y="719.8" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="703.8" data-bottom="726.1999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

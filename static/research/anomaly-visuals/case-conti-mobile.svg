<svg xmlns="http://www.w3.org/2000/svg" width="400" height="781" viewBox="0 0 400 781" role="img" aria-labelledby="title desc"><title id="title">BazarCall to Conti: one intrusion account</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: The selected investigation describes BazarCall, Trickbot, Cobalt Strike and Conti in one intrusion. Detection hypothesis: Correlate enumeration, remote administration, share access and security changes by host and identity. This is not every affiliate’s timeline. Administrative tools and backup changes can be legitimate.</desc><rect width="400" height="781" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">BazarCall to Conti:</tspan><tspan x="22" dy="42">one intrusion account</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="199.2" width="356" height="174" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="235.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="217.2" data-bottom="242.39999999999998"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="272.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="254.39999999999998" data-bottom="355.2"><tspan x="40" dy="0">The selected investigation</tspan><tspan x="40" dy="25.2">describes BazarCall, Trickbot,</tspan><tspan x="40" dy="25.2">Cobalt Strike and Conti in one</tspan><tspan x="40" dy="25.2">intrusion.</tspan></text><rect x="22" y="389.2" width="356" height="174" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="425.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="407.2" data-bottom="432.4"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="462.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="444.4" data-bottom="545.1999999999999"><tspan x="40" dy="0">Correlate enumeration, remote</tspan><tspan x="40" dy="25.2">administration, share access and</tspan><tspan x="40" dy="25.2">security changes by host and</tspan><tspan x="40" dy="25.2">identity.</tspan></text><rect x="22" y="579.2" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="615.2" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="597.2" data-bottom="698"><tspan x="39" dy="0">This is not every affiliate’s</tspan><tspan x="39" dy="25.2">timeline. Administrative tools and</tspan><tspan x="39" dy="25.2">backup changes can be</tspan><tspan x="39" dy="25.2">legitimate.</tspan></text><text x="22" y="730.8000000000001" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="716.8000000000001" data-bottom="756.0000000000001"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

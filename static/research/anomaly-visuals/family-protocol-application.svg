<svg xmlns="http://www.w3.org/2000/svg" width="800" height="738" viewBox="0 0 800 738" role="img" aria-labelledby="title desc"><title id="title">Inspect usage, not just the port</title><desc id="desc">Protocol / Application Usage: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Record parser version, sensor location and feature definition. Compare: Compare the entity’s application and destination history. New clients and legitimate encoded identifiers can shift a baseline.</desc><rect width="800" height="738" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Inspect usage, not just the port</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Protocol / Application Usage</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="228" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="294.79999999999995"><tspan x="45" dy="0">Observed</tspan><tspan x="45" dy="30.799999999999997">protocol</tspan></text><path d="M262 285.4 L282 285.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 280.4 L2
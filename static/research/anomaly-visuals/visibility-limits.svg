<svg xmlns="http://www.w3.org/2000/svg" width="800" height="958" viewBox="0 0 800 958" role="img" aria-labelledby="title desc"><title id="title">A detector can miss at different layers</title><desc id="desc">Different failure layers require different remedies. More complex scoring cannot recover events the pipeline never collected. Behavior: Low-rate or in-process activity. Sensor: Wrong position or missing source. Data pipeline: Drops, filters, clock or parser errors. Model: Wrong cohort or contaminated baseline. Investigate the layer: Record which assumption failed and test an alternative source or analytic. Avoid circular reasoning: A missing alert does not prove intentional evasion or absence of compromise. This is a diagnostic map, not a sourced chronology for any particular actor.</desc><rect width="800" height="958" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">A detector can miss at different</tspan><tspan x="30" dy="53.199999999999996">layers</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="228.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="243.59999999999997" data-bottom="274.4"><tspan x="45" dy="0">Behavior</tspan></text><text x="45" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="286.4" data-bottom="348"><tspan x="45" dy="0">Low-rate or in-process</tspan><tspan x="45" dy="30.799999999999997">activity.</tspan></text><path d="M390 295.79999999999995 L410 295.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 290.79999999999995 L410 295.79999999999995 L403 300.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="228.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="243.59999999999997" data-bottom="274.4"><tspan x="429" dy="0">Sensor</tspan></text><text x="429" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="286.4" data-bottom="348"><tspan x="429" dy="0">Wrong position or missing</tspan><tspan x="429" dy="30.799999999999997">source.</tspan></text><path d="M592 366.99999999999994 L592 384.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M592 384.99999999999994 L208 384.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M208 384.99999999999994 L208 402.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M203 395.99999999999994 L208 402.99999999999994 L213 395.99999999999994" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="30" y="406.99999999999994" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="443.99999999999994" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="421.99999999999994" data-bottom="452.79999999999995"><tspan x="45" dy="0">Data pipeline</tspan></text><text x="45" y="486.79999999999995" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="464.79999999999995" data-bottom="526.4"><tspan x="45" dy="0">Drops, filters, clock or</tspan><tspan x="45" dy="30.799999999999997">parser errors.</tspan></text><path d="M390 474.19999999999993 L410 474.19999999999993" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 469.19999999999993 L410 474.19999999999993 L403 479.19999999999993" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="406.99999999999994" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="443.99999999999994" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="421.99999999999994" data-bottom="452.79999999999995"><tspan x="429" dy="0">Model</tspan></text><text x="429" y="486.79999999999995" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="464.79999999999995" data-bottom="526.4"><tspan x="429" dy="0">Wrong cohort or</tspan><tspan x="429" dy="30.799999999999997">contaminated baseline.</tspan></text><rect x="30" y="565.3999999999999" width="360" height="202" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="605.3999999999999" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="583.3999999999999" data-bottom="614.1999999999998"><tspan x="48" dy="0">Investigate the layer</tspan></text><text x="48" y="648.1999999999998" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="626.1999999999998" data-bottom="749.3999999999999"><tspan x="48" dy="0">Record which assumption</tspan><tspan x="48" dy="30.799999999999997">failed and test an</tspan><tspan x="48" dy="30.799999999999997">alternative source or</tspan><tspan x="48" dy="30.799999999999997">analytic.</tspan></text><rect x="410" y="565.3999999999999" width="360" height="202" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="428" y="605.3999999999999" fill="#ffcd7a" font-size="22" font-weight="700" data-max-width="324" data-top="583.3999999999999" data-bottom="614.1999999999998"><tspan x="428" dy="0">Avoid circular reasoning</tspan></text><text x="428" y="648.1999999999998" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="626.1999999999998" data-bottom="718.5999999999998"><tspan x="428" dy="0">A missing alert does not</tspan><tspan x="428" dy="30.799999999999997">prove intentional evasion</tspan><tspan x="428" dy="30.799999999999997">or absence of compromise.</tspan></text><rect x="30" y="787.3999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="827.3999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="805.3999999999999" data-bottom="866.9999999999999"><tspan x="47" dy="0">This is a diagnostic map, not a sourced chronology for any</tspan><tspan x="47" dy="30.799999999999997">particular actor.</tspan></text><text x="30" y="926.9999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="910.9999999999999" data-bottom="933.3999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

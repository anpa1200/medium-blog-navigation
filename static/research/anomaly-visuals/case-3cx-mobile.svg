<svg xmlns="http://www.w3.org/2000/svg" width="400" height="831" viewBox="0 0 400 831" role="img" aria-labelledby="title desc"><title id="title">3CX: a signature is not a benign verdict</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: SentinelOne reported behavioral detections before public disclosure. GitHub-hosted icons carried encoded C2 information in the Windows chain. Detection hypothesis: Investigate new destinations and later execution associated with a normally trusted application. The icons were not described as executable payloads. Vendor-reported detection is not an independent EDR benchmark.</desc><rect width="400" height="831" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">3CX: a signature is</tspan><tspan x="22" dy="42">not a benign verdict</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="199.2" width="356" height="199.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="235.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="217.2" data-bottom="242.39999999999998"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="272.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="254.39999999999998" data-bottom="380.4"><tspan x="40" dy="0">SentinelOne reported behavioral</tspan><tspan x="40" dy="25.2">detections before public</tspan><tspan x="40" dy="25.2">disclosure. GitHub-hosted icons</tspan><tspan x="40" dy="25.2">carried encoded C2 information</tspan><tspan x="40" dy="25.2">in the Windows chain.</tspan></text><rect x="22" y="414.4" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="450.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="432.4" data-bottom="457.59999999999997"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="487.59999999999997" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="469.59999999999997" data-bottom="545.1999999999999"><tspan x="40" dy="0">Investigate new destinations and</tspan><tspan x="40" dy="25.2">later execution associated with</tspan><tspan x="40" dy="25.2">a normally trusted application.</tspan></text><rect x="22" y="579.2" width="356" height="166" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="615.2" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="597.2" data-bottom="723.2"><tspan x="39" dy="0">The icons were not described as</tspan><tspan x="39" dy="25.2">executable payloads.</tspan><tspan x="39" dy="25.2">Vendor-reported detection is</tspan><tspan x="39" dy="25.2">not an independent EDR</tspan><tspan x="39" dy="25.2">benchmark.</tspan></text><text x="22" y="781.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="767.2" data-bottom="806.4000000000001"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="989" viewBox="0 0 400 989" role="img" aria-labelledby="title desc"><title id="title">Order adds context</title><desc id="desc">Sequence: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Join a defined entity or session across ordered events. Compare: Declare permitted gaps, missing steps and late arrival. This illustrative workflow can also be legitimate; timing alone is not causality.</desc><rect width="400" height="989" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="101.6"><tspan x="22" dy="0">Order adds context</tspan></text><text x="22" y="133.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="115.6" data-bottom="140.79999999999998"><tspan x="22" dy="0">Sequence</tspan></text><text x="22" y="166.8" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="152.8" data-bottom="172.4"><tspan x="22" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="22" y="194.4" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="227.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="209.4" data-bottom="234.6"><tspan x="37" dy="0">Authentication</tspan></text><path d="M200 265.6 L200 301.6" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 294.6 L200 301.6 L205 294.6" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="305.6" width="356" height="67.2" rx="12" fill="#14233b
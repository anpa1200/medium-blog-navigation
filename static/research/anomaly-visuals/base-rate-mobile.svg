<svg xmlns="http://www.w3.org/2000/svg" width="400" height="826" viewBox="0 0 400 826" role="img" aria-labelledby="title desc"><title id="title">Rare events change alert precision</title><desc id="desc">Precision uses all alerts as its denominator; false-positive rate uses all benign events. A 1% false-positive rate does not mean 99% alert precision. These assumed counts explain base rates; they are not measured detector results.</desc><rect width="400" height="826" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Rare events change</tspan><tspan x="22" dy="42">alert precision</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">ILLUSTRATIVE ARITHMETIC</tspan></text><rect x="22" y="199.2" width="356" height="123.6" rx="12" fill="#14233b" stroke="#ffcd7a"/><text x="40" y="235.2" fill="#ffcd7a" font-size="18" font-weight="700" data-max-width="320" data-top="217.2" data-bottom="242.39999999999998"><tspan x="40" dy="0">Benign events</tspan></text><text x="40" y="272.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="254.39999999999998" data-bottom="304.79999999999995"><tspan x="40" dy="0">1,000,000 × 1% FPR → 10,000</tspan><tspan x="40" dy="25.2">false alerts</tspan></text><rect x="22" y="338.79999999999995" width="356" height="123.6" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="374.79999999999995" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="356.79999999999995" data-bottom="381.99999999999994"><tspan x="40" dy="0">Malicious events</tspan></text><text x="40" y="411.99999999999994" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="393.99999999999994" data-bottom="444.3999999999999"><tspan x="40" dy="0">100 × 90% recall → 90 true</tspan><tspan x="40" dy="25.2">alerts</tspan></text><text x="22" y="501.4" fill="#68e0cb" font-size="23" font-weight="400" data-max-width="356" data-top="478.4" data-bottom="542.8"><tspan x="22" dy="0">Precision = 90 / (90 +</tspan><tspan x="22" dy="32.199999999999996">10,000) = 0.89%</tspan></text><text x="22" y="576.8" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="558.8" data-bottom="609.1999999999999"><tspan x="22" dy="0">False-positive rate = FP / (FP +</tspan><tspan x="22" dy="25.2">TN). Precision = TP / (TP + FP).</tspan></text><rect x="22" y="625.1999999999999" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="661.1999999999999" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="643.1999999999999" data-bottom="718.8"><tspan x="39" dy="0">These assumed counts explain</tspan><tspan x="39" dy="25.2">base rates; they are not</tspan><tspan x="39" dy="25.2">measured detector results.</tspan></text><text x="22" y="776.8" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="762.8" data-bottom="802"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

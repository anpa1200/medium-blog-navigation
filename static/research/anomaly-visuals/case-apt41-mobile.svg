<svg xmlns="http://www.w3.org/2000/svg" width="400" height="923" viewBox="0 0 400 923" role="img" aria-labelledby="title desc"><title id="title">APT41: two accounts, not one invented chain</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: 2019: MESSAGETAP was an ELF data miner on Linux SMS servers. 2024: SQLULDR2 exports and PINEGROVE transfers appear in a separate investigation. Detection hypothesis: Check process provenance and capture outputs for the first case; database exports and storage destinations for the second. Loading libpcap or using cloud storage is not proof of theft. These are separate reports, not sequential stages.</desc><rect width="400" height="923" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">APT41: two accounts,</tspan><tspan x="22" dy="42">not one invented</tspan><tspan x="22" dy="42">chain</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="241.2" width="356" height="224.39999999999998" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="277.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="259.2" data-bottom="284.4"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="314.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="296.4" data-bottom="447.59999999999997"><tspan x="40" dy="0">2019: MESSAGETAP was an ELF</tspan><tspan x="40" dy="25.2">data miner on Linux SMS</tspan><tspan x="40" dy="25.2">servers. 2024: SQLULDR2</tspan><tspan x="40" dy="25.2">exports and PINEGROVE</tspan><tspan x="40" dy="25.2">transfers appear in a separate</tspan><tspan x="40" dy="25.2">investigation.</tspan></text><rect x="22" y="481.59999999999997" width="356" height="199.2" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="517.5999999999999" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="499.59999999999997" data-bottom="524.8"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="554.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="536.8" data-bottom="662.8"><tspan x="40" dy="0">Check process provenance and</tspan><tspan x="40" dy="25.2">capture outputs for the first</tspan><tspan x="40" dy="25.2">case; database exports and</tspan><tspan x="40" dy="25.2">storage destinations for the</tspan><tspan x="40" dy="25.2">second.</tspan></text><rect x="22" y="696.8" width="356" height="140.8" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="732.8" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="714.8" data-bottom="815.5999999999999"><tspan x="39" dy="0">Loading libpcap or using cloud</tspan><tspan x="39" dy="25.2">storage is not proof of theft.</tspan><tspan x="39" dy="25.2">These are separate reports, not</tspan><tspan x="39" dy="25.2">sequential stages.</tspan></text><text x="22" y="873.5999999999999" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="859.5999999999999" data-bottom="898.8"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

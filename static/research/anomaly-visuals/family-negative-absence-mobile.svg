<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1097" viewBox="0 0 400 1097" role="img" aria-labelledby="title desc"><title id="title">No event is not the same as no activity</title><desc id="desc">Negative Anomaly (Absence): one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Define when a source is expected to report. Compare: Check delivery, asset state, filters and retention separately. An outage or parser failure can look like deliberate impairment.</desc><rect width="400" height="1097" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">No event is not the</tspan><tspan x="22" dy="42">same as no activity</tspan></text><text x="22" y="175.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="157.6" data-bottom="182.79999999999998"><tspan x="22" dy="0">Negative Anomaly (Absence)</tspan></text><text x="22" y="208.8" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="194.8" data-bottom="214.4"><tspan x="22" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="22" y="236.4" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="269.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="251.4" data-bottom="276.6"><tspan x="37" dy="0">Expected heartbeat</tspan></text><path d="M200 307.6 L200 343.6" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 336.6 L200 343.6 L205 336.6" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="347.6" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="380.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="362.6" data-bottom="387.8"><tspan x="37" dy="0">Missing observation</tspan></text><path d="M200 418.8 L200 454.8" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 447.8 L200 454.8 L205 447.8" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="458.8" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="491.8" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="473.8" data-bottom="499"><tspan x="37" dy="0">Independent health check</tspan></text><text x="22" y="568" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="550" data-bottom="625.6"><tspan x="22" dy="0">The gap is an observation problem</tspan><tspan x="22" dy="25.2">until independent health evidence</tspan><tspan x="22" dy="25.2">explains it.</tspan></text><rect x="22" y="641.6" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="677.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="659.6" data-bottom="684.8000000000001"><tspan x="40" dy="0">Measure</tspan></text><text x="40" y="714.8000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="696.8000000000001" data-bottom="747.2"><tspan x="40" dy="0">Define when a source is expected</tspan><tspan x="40" dy="25.2">to report.</tspan></text><rect x="22" y="781.2" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="817.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="799.2" data-bottom="824.4000000000001"><tspan x="40" dy="0">Compare</tspan></text><text x="40" y="854.4000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="836.4000000000001" data-bottom="912.0000000000001"><tspan x="40" dy="0">Check delivery, asset state,</tspan><tspan x="40" dy="25.2">filters and retention</tspan><tspan x="40" dy="25.2">separately.</tspan></text><rect x="22" y="920.8000000000001" width="356" height="90.4" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="956.8000000000001" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="938.8000000000001" data-bottom="989.2"><tspan x="39" dy="0">An outage or parser failure can</tspan><tspan x="39" dy="25.2">look like deliberate impairment.</tspan></text><text x="22" y="1047.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1033.2" data-bottom="1072.4"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

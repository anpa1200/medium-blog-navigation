<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1186" viewBox="0 0 400 1186" role="img" aria-labelledby="title desc"><title id="title">LSASS process access needs provenance</title><desc id="desc">Bitmask meanings are separate from malicious intent. A familiar filename, signer or directory is not a universal safe exclusion. Sysmon 10: Source, target, time and access mask. Process context: Signer, hash, ancestry and call trace. Investigation: Compare authorized security and diagnostic tools. 0x1010: VM read + limited query information. 0x1410: The same rights plus query information. An access mask or unresolved call trace alone does not establish dumping or injection.</desc><rect width="400" height="1186" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">LSASS process</tspan><tspan x="22" dy="42">access needs</tspan><tspan x="22" dy="42">provenance</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="22" y="241.2" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="274.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="256.2" data-bottom="281.4"><tspan x="37" dy="0">Sysmon 10</tspan></text><text x="37" y="311.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="293.4" data-bottom="343.79999999999995"><tspan x="37" dy="0">Source, target, time and access</tspan><tspan x="37" dy="25.2">mask.</tspan></text><path d="M200 362.79999999999995 L200 398.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 391.79999999999995 L200 398.79999999999995 L205 391.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="402.79999999999995" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="435.79999999999995" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="417.79999999999995" data-bottom="442.99999999999994"><tspan x="37" dy="0">Process context</tspan></text><text x="37" y="472.99999999999994" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="454.99999999999994" data-bottom="505.3999999999999"><tspan x="37" dy="0">Signer, hash, ancestry and call</tspan><tspan x="37" dy="25.2">trace.</tspan></text><path d="M200 524.4 L200 560.4" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 553.4 L200 560.4 L205 553.4" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="564.4" width="356" height="117.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="597.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="579.4" data-bottom="604.6"><tspan x="37" dy="0">Investigation</tspan></text><text x="37" y="634.6" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="616.6" data-bottom="667"><tspan x="37" dy="0">Compare authorized security and</tspan><tspan x="37" dy="25.2">diagnostic tools.</tspan></text><rect x="22" y="706" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="742" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="724" data-bottom="749.2"><tspan x="40" dy="0">0x1010</tspan></text><text x="40" y="779.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="761.2" data-bottom="811.6"><tspan x="40" dy="0">VM read + limited query</tspan><tspan x="40" dy="25.2">information.</tspan></text><rect x="22" y="845.6" width="356" height="123.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="881.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="863.6" data-bottom="888.8000000000001"><tspan x="40" dy="0">0x1410</tspan></text><text x="40" y="918.8000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="900.8000000000001" data-bottom="951.2"><tspan x="40" dy="0">The same rights plus query</tspan><tspan x="40" dy="25.2">information.</tspan></text><rect x="22" y="985.2" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="1021.2" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="1003.2" data-bottom="1078.8"><tspan x="39" dy="0">An access mask or unresolved</tspan><tspan x="39" dy="25.2">call trace alone does not</tspan><tspan x="39" dy="25.2">establish dumping or injection.</tspan></text><text x="22" y="1136.8" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1122.8" data-bottom="1162"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1030" viewBox="0 0 400 1030" role="img" aria-labelledby="title desc"><title id="title">Track source, destination and units</title><desc id="desc">Data Movement: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Keep audit events, unique objects, records and bytes distinct. Compare: Review destination ownership and access authorization. Approved migration and backup can resemble exfiltration.</desc><rect width="400" height="1030" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Track source,</tspan><tspan x="22" dy="42">destination and units</tspan></text><text x="22" y="175.6" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="356" data-top="157.6" data-bottom="182.79999999999998"><tspan x="22" dy="0">Data Movement</tspan></text><text x="22" y="208.8" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="194.8" data-bottom="214.4"><tspan x="22" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="22" y="236.4" width="356" height="67.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="269.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="251.4" data-bottom="276.6"><tspan x="37" dy="0">Data source</tspan></text><path d="M200 307.6 L200 343.6" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 336.6 L200 343.6 L205 336.6" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="
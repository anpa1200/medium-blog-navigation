<svg xmlns="http://www.w3.org/2000/svg" width="800" height="781" viewBox="0 0 800 781" role="img" aria-labelledby="title desc"><title id="title">APT41: two accounts, not one invented chain</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: 2019: MESSAGETAP was an ELF data miner on Linux SMS servers. 2024: SQLULDR2 exports and PINEGROVE transfers appear in a separate investigation. Detection hypothesis: Check process provenance and capture outputs for the first case; database exports and storage destinations for the second. Loading libpcap or using cloud storage is not proof of theft. These are separate reports, not sequential stages.</desc><rect width="800" height="781" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">APT41: two accounts, not one</tspan><tspan x="30" dy="53.199999999999996">invented chain</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="30" y="228.59999999999997" width="740" height="171.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="48" y="268.59999999999997" fill="#68e0cb" font-size="22" font-weight="700" data-max-width="704" data-top="246.59999999999997" data-bottom="277.4"><tspan x="48" dy="0">Source-reported</tspan></text><text x="48" y="311.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="289.4" data-bottom="381.79999999999995"><tspan x="48" dy="0">2019: MESSAGETAP was an ELF data miner on Linux SMS</tspan><tspan x="48" dy="30.799999999999997">servers. 2024: SQLULDR2 exports and PINEGROVE</tspan><tspan x="48" dy="30.799999999999997">transfers appear in a separate investigation.</tspan></text><rect x="30" y="419.79999999999995" width="740" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="48" y="459.79999999999995" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="704" data-top="437.79999999999995" data-bottom="468.59999999999997"><tspan x="48" dy="0">Detection hypothesis</tspan></text><text x="48" y="502.59999999999997" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="704" data-top="480.59999999999997" data-bottom="573"><tspan x="48" dy="0">Check process provenance and capture outputs for the</tspan><tspan x="48" dy="30.799999999999997">first case; database exports and storage destinations for</tspan><tspan x="48" dy="30.799999999999997">the second.</tspan></text><rect x="30" y="611" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="651" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="629" data-bottom="690.6"><tspan x="47" dy="0">Loading libpcap or using cloud storage is not proof of</tspan><tspan x="47" dy="30.799999999999997">theft. These are separate reports, not sequential stages.</tspan></text><text x="30" y="750.6" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="734.6" data-bottom="757"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

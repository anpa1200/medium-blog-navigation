<svg xmlns="http://www.w3.org/2000/svg" width="400" height="755" viewBox="0 0 400 755" role="img" aria-labelledby="title desc"><title id="title">Impacket is a toolkit, not an attribution</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: CISA AA22-277A reports Impacket and data theft without assigning a named actor. Detection hypothesis: Correlate remote logons, process ancestry and mode-specific evidence. secretsdump is not synonymous with DCSync. Ordinary wmiexec is not a permanent WMI subscription.</desc><rect width="400" height="755" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="143.6"><tspan x="22" dy="0">Impacket is a toolkit,</tspan><tspan x="22" dy="42">not an attribution</tspan></text><text x="22" y="171.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="157.6" data-bottom="177.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="199.2" width="356" height="148.8" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="235.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="217.2" data-bottom="242.39999999999998"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="272.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="254.39999999999998" data-bottom="330"><tspan x="40" dy="0">CISA AA22-277A reports</tspan><tspan x="40" dy="25.2">Impacket and data theft without</tspan><tspan x="40" dy="25.2">assigning a named actor.</tspan></text><rect x="22" y="364" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="400" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="382" data-bottom="407.2"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="437.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="419.2" data-bottom="494.79999999999995"><tspan x="40" dy="0">Correlate remote logons,</tspan><tspan x="40" dy="25.2">process ancestry and</tspan><tspan x="40" dy="25.2">mode-specific evidence.</tspan></text><rect x="22" y="528.8" width="356" height="140.8" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="564.8" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="546.8" data-bottom="647.5999999999999"><tspan x="39" dy="0">secretsdump is not synonymous</tspan><tspan x="39" dy="25.2">with DCSync. Ordinary wmiexec is</tspan><tspan x="39" dy="25.2">not a permanent WMI</tspan><tspan x="39" dy="25.2">subscription.</tspan></text><text x="22" y="705.5999999999999" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="691.5999999999999" data-bottom="730.8"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

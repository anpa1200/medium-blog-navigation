<svg xmlns="http://www.w3.org/2000/svg" width="800" height="835" viewBox="0 0 800 835" role="img" aria-labelledby="title desc"><title id="title">Rare does not mean malicious</title><desc id="desc">Rare Process / Service: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Measure prevalence within a role and observation window. Compare: Check signer, hash, owner and collection coverage. New software, diagnostics and newly enabled telemetry can all look rare.</desc><rect width="800" height="835" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Rare does not mean malicious</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Rare Process / Service</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="740" height="200" rx="12" fill="#14233b" stroke="none"/><circle cx="60" cy="268.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="196" cy="268.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="332" cy="268.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="468" cy="268.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="604" cy="268.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="740" cy="268.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="60" cy="313.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="196" cy="313.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="332" cy="313.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="468" cy="313.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="604" cy="313.2" r="9" fill="#8cbcff" stroke="none" stroke-width="2"/><circle cx="740" cy="313.2" r="9" fill="#ffcd7a" stroke="none" stroke-width="2"/><text x="50" y="368.2" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="700" data-top="346.2" data-bottom="377"><tspan x="50" dy="0">Define cohort membership before comparing.</tspan></text><text x="30" y="450.2" fill="#c4d2e8" font-size="18" font-weight="400" data-max-width="740" data-top="432.2" data-bottom="457.4"><tspan x="30" dy="0">Illustrative geometry only; no measured scale or operational threshold.</tspan></text><rect x="30" y="473.4" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="513.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="491.4" data-bottom="522.1999999999999"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="556.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="534.1999999999999" data-bottom="626.5999999999999"><tspan x="48" dy="0">Measure prevalence within</tspan><tspan x="48" dy="30.799999999999997">a role and observation</tspan><tspan x="48" dy="30.799999999999997">window.</tspan></text><rect x="410" y="473.4" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="513.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="491.4" data-bottom="522.1999999999999"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="556.1999999999999" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="534.1999999999999" data-bottom="595.8"><tspan x="428" dy="0">Check signer, hash, owner</tspan><tspan x="428" dy="30.799999999999997">and collection coverage.</tspan></text><rect x="30" y="664.5999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="704.5999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="682.5999999999999" data-bottom="744.1999999999999"><tspan x="47" dy="0">New software, diagnostics and newly enabled telemetry can</tspan><tspan x="47" dy="30.799999999999997">all look rare.</tspan></text><text x="30" y="804.1999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="788.1999999999999" data-bottom="810.5999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

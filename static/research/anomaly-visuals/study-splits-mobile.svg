<svg xmlns="http://www.w3.org/2000/svg" width="400" height="1161" viewBox="0 0 400 1161" role="img" aria-labelledby="title desc"><title id="title">Freeze the experiment before the test</title><desc id="desc">Chronological train, validation and test partitions are disjoint. The gated-MAD model reuses the ungated threshold; the test is not used for tuning. The generator is a constructed world, not a representative enterprise sample.</desc><rect width="400" height="1161" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Freeze the</tspan><tspan x="22" dy="42">experiment before</tspan><tspan x="22" dy="42">the test</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SEEDED SYNTHETIC EXPERIMENT</tspan></text><rect x="22" y="241.2" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="274.2" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="256.2" data-bottom="281.4"><tspan x="37" dy="0">TRAIN</tspan></text><text x="37" y="311.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="293.4" data-bottom="318.59999999999997"><tspan x="37" dy="0">Days 0–27 · 28 days</tspan></text><path d="M200 337.6 L200 373.6" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 366.6 L200 373.6 L205 366.6" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="377.6" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="410.6" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="392.6" data-bottom="417.8"><tspan x="37" dy="0">VALIDATE</tspan></text><text x="37" y="447.8" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="429.8" data-bottom="455"><tspan x="37" dy="0">Days 28–41 · 14 days</tspan></text><path d="M200 474 L200 510" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M195 503 L200 510 L205 503" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="22" y="514" width="356" height="92.4" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="37" y="547" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="326" data-top="529" data-bottom="554.2"><tspan x="37" dy="0">FROZEN TEST</tspan></text><text x="37" y="584.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="326" data-top="566.2" data-bottom="591.4000000000001"><tspan x="37" dy="0">Days 42–55 · 14 days</tspan></text><rect x="22" y="630.4000000000001" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="40" y="666.4000000000001" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="648.4000000000001" data-bottom="673.6000000000001"><tspan x="40" dy="0">48 entities / 2688 entity-days</tspan></text><text x="40" y="703.6000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="685.6000000000001" data-bottom="761.2000000000002"><tspan x="40" dy="0">Seed 20260921. No baseline</tspan><tspan x="40" dy="25.2">updates during validation or</tspan><tspan x="40" dy="25.2">test.</tspan></text><rect x="22" y="795.2" width="356" height="148.8" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="831.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="813.2" data-bottom="838.4000000000001"><tspan x="40" dy="0">Held-out test labels</tspan></text><text x="40" y="868.4000000000001" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="850.4000000000001" data-bottom="926.0000000000001"><tspan x="40" dy="0">26 generated attack</tspan><tspan x="40" dy="25.2">entity-days; 646 generated</tspan><tspan x="40" dy="25.2">benign entity-days.</tspan></text><rect x="22" y="960" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="996" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="978" data-bottom="1053.6"><tspan x="39" dy="0">The generator is a constructed</tspan><tspan x="39" dy="25.2">world, not a representative</tspan><tspan x="39" dy="25.2">enterprise sample.</tspan></text><text x="22" y="1111.6" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="1097.6" data-bottom="1136.8"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

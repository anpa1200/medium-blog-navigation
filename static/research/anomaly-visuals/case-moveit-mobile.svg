<svg xmlns="http://www.w3.org/2000/svg" width="400" height="772" viewBox="0 0 400 772" role="img" aria-labelledby="title desc"><title id="title">MOVEit: application account, not Windows user</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: LEMURLOOT interacted with the MOVEit database and created a MOVEit application account. Detection hypothesis: Correlate webshell access, application sessions, database changes and exports. Windows Security 4720 does not describe this SQL-backed application-account creation.</desc><rect width="400" height="772" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">MOVEit: application</tspan><tspan x="22" dy="42">account, not Windows</tspan><tspan x="22" dy="42">user</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="241.2" width="356" height="148.8" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="277.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="259.2" data-bottom="284.4"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="314.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="296.4" data-bottom="372"><tspan x="40" dy="0">LEMURLOOT interacted with the</tspan><tspan x="40" dy="25.2">MOVEit database and created a</tspan><tspan x="40" dy="25.2">MOVEit application account.</tspan></text><rect x="22" y="406" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="442" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="424" data-bottom="449.2"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="479.2" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="461.2" data-bottom="536.8"><tspan x="40" dy="0">Correlate webshell access,</tspan><tspan x="40" dy="25.2">application sessions, database</tspan><tspan x="40" dy="25.2">changes and exports.</tspan></text><rect x="22" y="570.8" width="356" height="115.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="606.8" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="588.8" data-bottom="664.4"><tspan x="39" dy="0">Windows Security 4720 does not</tspan><tspan x="39" dy="25.2">describe this SQL-backed</tspan><tspan x="39" dy="25.2">application-account creation.</tspan></text><text x="22" y="722.4" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="708.4" data-bottom="747.6"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

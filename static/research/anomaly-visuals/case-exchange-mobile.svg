<svg xmlns="http://www.w3.org/2000/svg" width="400" height="873" viewBox="0 0 400 873" role="img" aria-labelledby="title desc"><title id="title">Exchange: keep campaign evidence separate</title><desc id="desc">The solid evidence panel summarizes cited reporting; the dashed hypothesis panel is author inference. No victim-telemetry replay or validation of the author’s proposed detector is implied. Source-reported: Microsoft described Exchange exploitation and webshell deployment. Broader post-exploitation reporting includes multiple actors. Detection hypothesis: Join unusual web requests, ASPX writes and shell ancestry with the server’s role. Do not assign every post-exploitation observation to HAFNIUM. Standard IIS logs do not expose arbitrary request bodies.</desc><rect width="400" height="873" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="22" y="40" fill="#68e0cb" font-size="14" font-weight="700" data-max-width="356" data-top="26" data-bottom="45.599999999999994"><tspan x="22" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="22" y="89.6" fill="#f3f7ff" font-size="30" font-weight="700" data-max-width="356" data-top="59.599999999999994" data-bottom="185.59999999999997"><tspan x="22" dy="0">Exchange: keep</tspan><tspan x="22" dy="42">campaign evidence</tspan><tspan x="22" dy="42">separate</tspan></text><text x="22" y="213.6" fill="#ffcd7a" font-size="14" font-weight="700" data-max-width="356" data-top="199.6" data-bottom="219.2"><tspan x="22" dy="0">SOURCE-REPORTED + AUTHOR INFERENCE</tspan></text><rect x="22" y="241.2" width="356" height="199.2" rx="12" fill="#14233b" stroke="#68e0cb"/><text x="40" y="277.2" fill="#68e0cb" font-size="18" font-weight="700" data-max-width="320" data-top="259.2" data-bottom="284.4"><tspan x="40" dy="0">Source-reported</tspan></text><text x="40" y="314.4" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="296.4" data-bottom="422.4"><tspan x="40" dy="0">Microsoft described Exchange</tspan><tspan x="40" dy="25.2">exploitation and webshell</tspan><tspan x="40" dy="25.2">deployment. Broader</tspan><tspan x="40" dy="25.2">post-exploitation reporting</tspan><tspan x="40" dy="25.2">includes multiple actors.</tspan></text><rect x="22" y="456.4" width="356" height="148.8" rx="12" fill="#14233b" stroke="#8cbcff" stroke-dasharray="7 5"/><text x="40" y="492.4" fill="#8cbcff" font-size="18" font-weight="700" data-max-width="320" data-top="474.4" data-bottom="499.59999999999997"><tspan x="40" dy="0">Detection hypothesis</tspan></text><text x="40" y="529.5999999999999" fill="#f3f7ff" font-size="18" font-weight="400" data-max-width="320" data-top="511.59999999999997" data-bottom="587.1999999999999"><tspan x="40" dy="0">Join unusual web requests, ASPX</tspan><tspan x="40" dy="25.2">writes and shell ancestry with</tspan><tspan x="40" dy="25.2">the server’s role.</tspan></text><rect x="22" y="621.2" width="356" height="166" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="39" y="657.2" fill="#ffcd7a" font-size="18" font-weight="500" data-max-width="322" data-top="639.2" data-bottom="765.2"><tspan x="39" dy="0">Do not assign every</tspan><tspan x="39" dy="25.2">post-exploitation observation to</tspan><tspan x="39" dy="25.2">HAFNIUM. Standard IIS logs do</tspan><tspan x="39" dy="25.2">not expose arbitrary request</tspan><tspan x="39" dy="25.2">bodies.</tspan></text><text x="22" y="823.2" fill="#c4d2e8" font-size="14" font-weight="400" data-max-width="356" data-top="809.2" data-bottom="848.4000000000001"><tspan x="22" dy="0">Andrey Pautov · 1200km.com · Revised</tspan><tspan x="22" dy="19.599999999999998">research</tspan></text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="785" viewBox="0 0 800 785" role="img" aria-labelledby="title desc"><title id="title">Direct child is not any descendant</title><desc id="desc">Parent-Child Execution: one operational feature family, not a mutually exclusive statistical class. The incident cards below provide separate source-reported examples; this schematic does not reconstruct those incidents. Measure: Use stable process identifiers and parent identifiers. Compare: Declare direct-child matching or an ancestry search. PID reuse, missing ancestry and in-process execution limit coverage.</desc><rect width="800" height="785" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="115.6"><tspan x="30" dy="0">Direct child is not any descendant</tspan></text><text x="30" y="151.6" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="129.6" data-bottom="160.39999999999998"><tspan x="30" dy="0">Parent-Child Execution</tspan></text><text x="30" y="189.39999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="172.39999999999998" data-bottom="196.2"><tspan x="30" dy="0">SCHEMATIC · NOT OBSERVED DATA</tspan></text><rect x="30" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="264"><tspan x="45" dy="0">Web worker</tspan></text><path d="M262 270 L282 270" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M275 265 L282 270 L275 275" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="286" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="301" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="264"><tspan x="301" dy="0">Shell child</tspan></text><path d="M518 270 L538 270" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M531 265 L538 270 L531 275" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="542" y="218.2" width="228" height="103.6" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="557" y="255.2" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="198" data-top="233.2" data-bottom="294.79999999999995"><tspan x="557" dy="0">Later</tspan><tspan x="557" dy="30.799999999999997">descendant</tspan></text><text x="30" y="367.79999999999995" fill="#c4d2e8" font-size="22" font-weight="400" data-max-width="740" data-top="345.79999999999995" data-bottom="407.4"><tspan x="30" dy="0">Read each arrow as a parent → child relationship. The third</tspan><tspan x="30" dy="30.799999999999997">node is a descendant of the first.</tspan></text><rect x="30" y="423.4" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="48" y="463.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="441.4" data-bottom="472.2"><tspan x="48" dy="0">Measure</tspan></text><text x="48" y="506.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="484.2" data-bottom="576.6"><tspan x="48" dy="0">Use stable process</tspan><tspan x="48" dy="30.799999999999997">identifiers and parent</tspan><tspan x="48" dy="30.799999999999997">identifiers.</tspan></text><rect x="410" y="423.4" width="360" height="171.2" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="428" y="463.4" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="324" data-top="441.4" data-bottom="472.2"><tspan x="428" dy="0">Compare</tspan></text><text x="428" y="506.2" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="324" data-top="484.2" data-bottom="576.6"><tspan x="428" dy="0">Declare direct-child</tspan><tspan x="428" dy="30.799999999999997">matching or an ancestry</tspan><tspan x="428" dy="30.799999999999997">search.</tspan></text><rect x="30" y="614.5999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="654.5999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="632.5999999999999" data-bottom="694.1999999999999"><tspan x="47" dy="0">PID reuse, missing ancestry and in-process execution limit</tspan><tspan x="47" dy="30.799999999999997">coverage.</tspan></text><text x="30" y="754.1999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="738.1999999999999" data-bottom="760.5999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>

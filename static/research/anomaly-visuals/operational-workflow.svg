<svg xmlns="http://www.w3.org/2000/svg" width="800" height="736" viewBox="0 0 800 736" role="img" aria-labelledby="title desc"><title id="title">Close the loop before operational use</title><desc id="desc">A proposed operational workflow. This article has not completed a representative production trial or certified automated containment safety. Collect: Generate and inspect real source events. Replay: Include authorized benign and attack cases. Shadow: Measure alerts, misses and analyst effort. Review: Assign an owner, rollback and revalidation plan. Investigation priority, incident declaration and automatic containment are different decisions.</desc><rect width="800" height="736" rx="18" fill="#0b1426"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="42" fill="#68e0cb" font-size="16" font-weight="700" data-max-width="740" data-top="26" data-bottom="48.4"><tspan x="30" dy="0">1200km / DETECTION ENGINEERING</tspan></text><text x="30" y="100.4" fill="#f3f7ff" font-size="38" font-weight="700" data-max-width="740" data-top="62.4" data-bottom="168.79999999999998"><tspan x="30" dy="0">Close the loop before operational</tspan><tspan x="30" dy="53.199999999999996">use</tspan></text><text x="30" y="199.79999999999998" fill="#ffcd7a" font-size="17" font-weight="700" data-max-width="740" data-top="182.79999999999998" data-bottom="206.59999999999997"><tspan x="30" dy="0">CONCEPTUAL MODEL</tspan></text><rect x="30" y="228.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="243.59999999999997" data-bottom="274.4"><tspan x="45" dy="0">Collect</tspan></text><text x="45" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="286.4" data-bottom="348"><tspan x="45" dy="0">Generate and inspect real</tspan><tspan x="45" dy="30.799999999999997">source events.</tspan></text><path d="M390 295.79999999999995 L410 295.79999999999995" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 290.79999999999995 L410 295.79999999999995 L403 300.79999999999995" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="228.59999999999997" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="265.59999999999997" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="243.59999999999997" data-bottom="274.4"><tspan x="429" dy="0">Replay</tspan></text><text x="429" y="308.4" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="286.4" data-bottom="348"><tspan x="429" dy="0">Include authorized benign</tspan><tspan x="429" dy="30.799999999999997">and attack cases.</tspan></text><path d="M592 366.99999999999994 L592 384.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M592 384.99999999999994 L208 384.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M208 384.99999999999994 L208 402.99999999999994" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M203 395.99999999999994 L208 402.99999999999994 L213 395.99999999999994" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="30" y="406.99999999999994" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="45" y="443.99999999999994" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="421.99999999999994" data-bottom="452.79999999999995"><tspan x="45" dy="0">Shadow</tspan></text><text x="45" y="486.79999999999995" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="464.79999999999995" data-bottom="526.4"><tspan x="45" dy="0">Measure alerts, misses and</tspan><tspan x="45" dy="30.799999999999997">analyst effort.</tspan></text><path d="M390 474.19999999999993 L410 474.19999999999993" stroke="#8cbcff" stroke-width="2.5" fill="none"/><path d="M403 469.19999999999993 L410 474.19999999999993 L403 479.19999999999993" stroke="#8cbcff" stroke-width="2" fill="none"/><rect x="414" y="406.99999999999994" width="356" height="134.39999999999998" rx="12" fill="#14233b" stroke="#8cbcff"/><text x="429" y="443.99999999999994" fill="#8cbcff" font-size="22" font-weight="700" data-max-width="326" data-top="421.99999999999994" data-bottom="452.79999999999995"><tspan x="429" dy="0">Review</tspan></text><text x="429" y="486.79999999999995" fill="#f3f7ff" font-size="22" font-weight="400" data-max-width="326" data-top="464.79999999999995" data-bottom="526.4"><tspan x="429" dy="0">Assign an owner, rollback</tspan><tspan x="429" dy="30.799999999999997">and revalidation plan.</tspan></text><rect x="30" y="565.3999999999999" width="740" height="101.6" rx="12" fill="#30283a" stroke="#ffcd7a"/><text x="47" y="605.3999999999999" fill="#ffcd7a" font-size="22" font-weight="500" data-max-width="706" data-top="583.3999999999999" data-bottom="644.9999999999999"><tspan x="47" dy="0">Investigation priority, incident declaration and automatic</tspan><tspan x="47" dy="30.799999999999997">containment are different decisions.</tspan></text><text x="30" y="704.9999999999999" fill="#c4d2e8" font-size="16" font-weight="400" data-max-width="740" data-top="688.9999999999999" data-bottom="711.3999999999999"><tspan x="30" dy="0">Andrey Pautov · 1200km.com · Revised research</tspan></text></g></svg>
